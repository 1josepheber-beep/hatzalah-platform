<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Hatzalah Platform</title>
<style>
  :root{
    --brand:#143D75; --brand-deep:#0D2A52; --ink:#12161C; --muted:#5C6675;
    --line:#DFE4EC; --bg:#F4F6FA; --card:#fff; --red:#B3121B; --green:#1B7F3B;
    --amber:#8A6A1A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .hidden{display:none !important}
  button,input,select,textarea{font:inherit}
  :focus-visible{outline:2px solid #7FA8E0;outline-offset:2px}

  /* sign in */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:var(--brand);padding:24px}
  #login .box{width:100%;max-width:380px;color:#fff}
  #login h1{font-size:23px;margin:0 0 4px;font-weight:650}
  #login p{margin:0 0 24px;opacity:.7}
  .f{margin-bottom:13px}
  .f label{display:block;font-size:13px;margin-bottom:5px;opacity:.8}
  .f textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .f input,.f select,.f textarea{width:100%;padding:11px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink);font-size:15px}
  #login .f input{border-color:rgba(255,255,255,.25);background:rgba(0,0,0,.22);color:#fff}
  .btn{padding:11px 16px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-weight:600;cursor:pointer}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.danger{background:#FDECEC;border-color:#F0BEC0;color:var(--red)}
  .btn.ok{background:#EAF4EC;border-color:#B9DCC4;color:var(--green)}
  .btn:disabled{opacity:.5;cursor:default}
  #login .btn{width:100%;background:#fff;color:var(--brand);border:0;padding:13px}
  .err{background:#FDECEC;border:1px solid #F0BEC0;color:var(--red);
    padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:13px}
  #login .err{background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.3);color:#FFDDDF}

  /* chrome */
  header{background:var(--brand);color:#fff;padding:12px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:150px}
  header select{padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.22);color:#fff;font-size:14px;max-width:230px}
  header .btn{background:rgba(255,255,255,.14);border:0;color:#fff;padding:7px 12px;font-size:14px}
  nav{background:var(--brand-deep);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  nav button{background:none;border:0;color:rgba(255,255,255,.72);padding:12px 14px;
    font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
    border-bottom:3px solid transparent}
  nav button[aria-current="true"]{color:#fff;border-bottom-color:#fff;font-weight:650}
  main{padding:18px;max-width:1000px;margin:0 auto}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
    background:#12161C;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.25)}

  /* content */
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 3px;font-size:16px}
  .card .hint{margin:0 0 14px;color:var(--muted);font-size:13.5px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);padding:8px 9px;border-bottom:2px solid var(--line)}
  td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:5px}
  .pill.pending{background:#FFF3D4;color:var(--amber)}
  .pill.active{background:#EAF4EC;color:var(--green)}
  .pill.suspended{background:#FDECEC;color:var(--red)}
  .pill.admin{background:#EAF0F9;color:#28456F}
  .small{font-size:13px;color:var(--muted)}
  .warn{background:#FFF8E6;border:1px solid #E8CE86;color:#6B520C;
    padding:10px 12px;border-radius:9px;font-size:13.5px;margin-bottom:13px}
  .empty{text-align:center;color:var(--muted);padding:30px}
  .bar-outer{height:9px;background:#E3E8F0;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar-inner{height:100%;background:var(--green);width:0;transition:width .2s}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted)}
  .steps{display:flex;flex-direction:column;gap:14px;margin-bottom:4px}
  .step{display:flex;gap:12px;align-items:flex-start}
  .step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700}
  .linklike{background:none;border:0;color:var(--brand);text-decoration:underline;
    padding:0;cursor:pointer;font-size:13px}
  .maprow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--line)}
  .maprow:last-of-type{border-bottom:0}
  .maprow .arrow{color:var(--muted)}
  .maprow .yours{font-weight:600;word-break:break-word}
  .maprow .sample{font-size:12px;color:var(--muted);font-weight:400}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 0;border-bottom:1px solid var(--line)}
  .switch:last-child{border-bottom:0}
  .switch b{font-weight:600;font-size:14.5px}
  .toggle{width:48px;height:27px;border-radius:99px;border:0;background:#CBD2DD;
    position:relative;cursor:pointer;flex:none}
  .toggle[aria-pressed="true"]{background:var(--green)}
  .toggle span{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
    background:#fff;transition:transform .16s}
  .toggle[aria-pressed="true"] span{transform:translateX(21px)}
  .toggle:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>

<section id="login">
  <div class="box">
    <h1>Platform Admin</h1>
    <p>Sign in to manage organizations</p>
    <div id="loginErr" class="err hidden"></div>
    <div class="f"><label for="email">Email</label>
      <input id="email" type="email" autocomplete="username"></div>
    <div class="f"><label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn">Sign in</button>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <h1>Admin</h1>
    <select id="orgPick"></select>
    <button id="newOrgBtn" class="btn hidden">New organization</button>
    <button id="signout" class="btn">Sign out</button>
  </header>
  <nav>
    <button data-tab="members"   aria-current="true">Members</button>
    <button data-tab="hospitals">Hospitals</button>
    <button data-tab="protocols">Protocols</button>
    <button data-tab="settings">Organization</button>
    <button data-tab="features">Features</button>
  </nav>
  <main>
    <div id="tab-members"></div>
    <div id="tab-hospitals" class="hidden"></div>
    <div id="tab-protocols" class="hidden"></div>
    <div id="tab-settings" class="hidden"></div>
    <div id="tab-features" class="hidden"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://fwjxskdgzzfgqhnabrpa.supabase.co";
  var SUPABASE_KEY = "sb_publishable_vbsCkIpZsk7bh-PjbhIYSw__t9MtXJi";

  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var $  = function(id){ return document.getElementById(id); };

  var isSuper = false, orgs = [], orgId = null, org = null, tab = "members";

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }
  function oops(e){ toast(e && e.message ? e.message : "Something went wrong"); }

  /* ---------------- sign in ---------------- */
  $("loginBtn").addEventListener("click", function(){
    var b = $("loginBtn");
    $("loginErr").classList.add("hidden");
    b.disabled = true; b.textContent = "Signing in\u2026";
    db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value })
      .then(function(r){
        b.disabled = false; b.textContent = "Sign in";
        if(r.error){ $("loginErr").textContent = r.error.message;
                     $("loginErr").classList.remove("hidden"); return; }
        boot();
      }).catch(function(){
        b.disabled = false; b.textContent = "Sign in";
        $("loginErr").textContent = "Could not reach the server.";
        $("loginErr").classList.remove("hidden");
      });
  });
  $("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") $("loginBtn").click(); });
  $("signout").addEventListener("click", function(){
    db.auth.signOut().then(function(){ location.reload(); });
  });

  /* ---------------- boot ---------------- */
  function boot(){
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");

    db.auth.getUser().then(function(u){
      var uid = u && u.data && u.data.user ? u.data.user.id : null;
      return db.from("profiles").select("is_super_admin").eq("id", uid).maybeSingle();
    }).then(function(r){
      isSuper = !!(r.data && r.data.is_super_admin);
      $("newOrgBtn").classList.toggle("hidden", !isSuper);
      return db.from("orgs").select("*").order("name");
    }).then(function(r){
      orgs = r.data || [];
      if(!orgs.length){
        $("tab-members").innerHTML = '<div class="card"><div class="empty">'
          + 'You are not an administrator of any organization.</div></div>';
        return;
      }
      $("orgPick").innerHTML = orgs.map(function(o){
        return '<option value="'+o.id+'">'+esc(o.name)+' ('+esc(o.code)+')</option>';
      }).join("");
      selectOrg(orgs[0].id);
    }).catch(oops);
  }

  function selectOrg(id){
    orgId = id;
    for(var i=0;i<orgs.length;i++){ if(orgs[i].id === id) org = orgs[i]; }
    $("orgPick").value = id;
    render();
  }
  $("orgPick").addEventListener("change", function(){ selectOrg($("orgPick").value); });

  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.addEventListener("click", function(){
      tab = b.getAttribute("data-tab");
      Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(x){
        x.setAttribute("aria-current", x === b ? "true" : "false");
      });
      ["members","hospitals","protocols","settings","features"].forEach(function(t){
        $("tab-"+t).classList.toggle("hidden", t !== tab);
      });
      render();
    });
  });

  function render(){
    if(!org) return;
    if(tab === "members")   renderMembers();
    if(tab === "hospitals") renderHospitals();
    if(tab === "protocols") renderProtocols();
    if(tab === "settings")  renderSettings();
    if(tab === "features")  renderFeatures();
  }

  /* ================= MEMBERS ================= */
  function renderMembers(){
    var el = $("tab-members");
    el.innerHTML = '<div class="card"><div class="empty">Loading\u2026</div></div>';

    Promise.all([
      db.from("memberships")
        .select("id,user_id,role,status,unit_number,display_name,cert_level,duty_status")
        .eq("org_id", orgId),
      db.from("profiles").select("id,full_name,email,phone")
    ]).then(function(r){
      if(r[0].error) throw r[0].error;
      var people = {};
      (r[1].data||[]).forEach(function(p){ people[p.id] = p; });

      var rows = (r[0].data||[]).map(function(m){
        m.person = people[m.user_id] || {};
        return m;
      });
      rows.sort(function(a,b){
        var rank = {pending:0, active:1, suspended:2, removed:3};
        if(rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
        return (a.unit_number||"").localeCompare(b.unit_number||"");
      });

      var pending = rows.filter(function(m){ return m.status === "pending"; });

      var html = "";
      if(pending.length){
        html += '<div class="warn"><b>'+pending.length+' waiting for approval.</b> '
             +  'They signed up with an organization email but cannot see anything yet.</div>';
      }

      html += '<div class="card"><h2>Members</h2>'
           +  '<p class="hint">'+rows.length+' on the roster. '
           +  'Approve new sign-ups, set roles, or suspend access here.</p>';

      if(!rows.length){
        html += '<div class="empty">Nobody has signed up yet.</div></div>';
        el.innerHTML = html; return;
      }

      html += '<div style="overflow-x:auto"><table><thead><tr>'
           +  '<th>Name</th><th>Unit</th><th>Role</th><th>Status</th><th></th>'
           +  '</tr></thead><tbody>';

      rows.forEach(function(m){
        var name = m.display_name || m.person.full_name || m.person.email || "\u2014";
        html += '<tr>'
          + '<td><b>'+esc(name)+'</b><div class="small">'+esc(m.person.email||"")+'</div></td>'
          + '<td>'+esc(m.unit_number||"\u2014")+'</td>'
          + '<td><select class="js-role" data-id="'+m.id+'">'
          +   ["member","dispatcher","admin","guest"].map(function(rr){
                return '<option value="'+rr+'"'+(m.role===rr?" selected":"")+'>'+rr+'</option>';
              }).join("")
          + '</select></td>'
          + '<td><span class="pill '+esc(m.status)+'">'+esc(m.status)+'</span></td>'
          + '<td class="row">'
          +   (m.status === "pending"
                ? '<button class="btn ok js-approve" data-id="'+m.id+'">Approve</button>' : '')
          +   (m.status === "active"
                ? '<button class="btn danger js-suspend" data-id="'+m.id+'">Suspend</button>' : '')
          +   (m.status === "suspended"
                ? '<button class="btn ok js-approve" data-id="'+m.id+'">Reinstate</button>' : '')
          + '</td></tr>';
      });

      html += '</tbody></table></div></div>';
      el.innerHTML = html;
    }).catch(function(e){
      el.innerHTML = '<div class="card"><div class="err">'+esc(e.message||"Could not load members")+'</div></div>';
    });
  }

  /* ================= HOSPITALS ================= */
  function renderHospitals(){
    var el = $("tab-hospitals");
    el.innerHTML = '<div class="card"><div class="empty">Loading\u2026</div></div>';

    db.from("hospitals").select("*").eq("org_id", orgId).order("sort_order")
      .then(function(r){
        if(r.error) throw r.error;
        var rows = r.data || [];
        var gaps = rows.filter(function(h){ return !h.phone_call || !h.address; }).length;
        var noCoords = rows.filter(function(h){ return !h.lat || !h.lng; }).length;

        var html = '<div class="card"><h2>Import your hospital list</h2>'
          + '<p class="hint">Upload a spreadsheet. If your headings are different from ours you '
          + 'can match them up on the next step \u2014 you do not need to reformat anything.</p>'
          + '<div class="steps">'
          +   '<div class="step"><span class="n">1</span><div>'
          +     '<b>Start from our template</b><div class="small">Optional. Already have a list? '
          +     'Skip straight to step 2.</div>'
          +     '<button id="imp_tpl" class="btn" style="margin-top:8px">Download template (.csv)</button>'
          +   '</div></div>'
          +   '<div class="step"><span class="n">2</span><div>'
          +     '<b>Upload your file</b><div class="small">Excel (.xlsx) or .csv</div>'
          +     '<input id="imp_file" type="file" accept=".csv,.xlsx,.xls" style="margin-top:8px">'
          +     '<div class="small" style="margin-top:6px">'
          +       '<button id="imp_paste_toggle" class="linklike">or paste from the clipboard instead</button>'
          +     '</div>'
          +     '<div id="imp_paste_wrap" class="hidden" style="margin-top:8px">'
          +       '<textarea id="imp_data" rows="5" placeholder="Paste rows including the heading row"></textarea>'
          +       '<button id="imp_paste_go" class="btn" style="margin-top:8px">Use this</button>'
          +     '</div>'
          +   '</div></div>'
          + '</div>'
          + '<div id="imp_out"></div></div>'

          + '<div class="card"><h2>Add a hospital</h2>'
          + '<p class="hint">Only the name is required. Everything else can be filled in later.</p>'
          + '<div class="grid2">'
          + '<div class="f"><label>Name</label><input id="nh_name"></div>'
          + '<div class="f"><label>Phone</label><input id="nh_phone"></div>'
          + '<div class="f"><label>Red phone</label><input id="nh_red"></div>'
          + '<div class="f"><label>Door code</label><input id="nh_door"></div>'
          + '<div class="f" style="grid-column:1/-1"><label>Address</label><input id="nh_addr"></div>'
          + '<div class="f"><label>Latitude</label><input id="nh_lat" inputmode="decimal" placeholder="29.693237"></div>'
          + '<div class="f"><label>Longitude</label><input id="nh_lng" inputmode="decimal" placeholder="-95.520742"></div>'
          + '</div>'
          + '<p class="hint" style="margin:0 0 12px">Coordinates point Navigate at the ambulance bay '
          + 'instead of the front door. When they are set they win, and the address is still shown '
          + 'on the card.</p>'
          + '<button id="nh_add" class="btn primary">Add hospital</button></div>';

        html += '<div class="card"><h2>'+rows.length+' hospitals</h2>';
        if(gaps){
          html += '<p class="hint">'+gaps+' are missing a phone number or an address. '
               +  'Members will see "not on file" for those.</p>';
        }
        if(noCoords){
          html += '<p class="hint">'+noCoords+' have no ambulance bay coordinates, so Navigate '
               +  'will send members to the street address instead.</p>';
        }

        if(!rows.length){
          html += '<div class="empty">No hospitals yet.</div></div>';
          el.innerHTML = html; wireHospitalForm(); return;
        }

        html += '<div style="overflow-x:auto"><table><thead><tr>'
             +  '<th>Name</th><th>Phone</th><th>Door</th><th>Address</th>'
             +  '<th>Ambulance bay</th><th></th>'
             +  '</tr></thead><tbody>';
        rows.forEach(function(h){
          html += '<tr>'
            + '<td><input class="js-h" data-id="'+h.id+'" data-f="name" value="'+esc(h.name)+'"></td>'
            + '<td><input class="js-h" data-id="'+h.id+'" data-f="phone_call" value="'+esc(h.phone_call||"")+'" placeholder="\u2014"></td>'
            + '<td><input class="js-h" data-id="'+h.id+'" data-f="door_code" value="'+esc(h.door_code||"")+'" placeholder="\u2014" style="width:90px"></td>'
            + '<td><input class="js-h" data-id="'+h.id+'" data-f="address" value="'+esc(h.address||"")+'" placeholder="\u2014"></td>'
            + '<td style="white-space:nowrap">'
            +   '<input class="js-h" data-id="'+h.id+'" data-f="lat" value="'+esc(h.lat||"")+'" placeholder="lat" style="width:88px" inputmode="decimal">'
            +   '<input class="js-h" data-id="'+h.id+'" data-f="lng" value="'+esc(h.lng||"")+'" placeholder="lng" style="width:88px;margin-left:4px" inputmode="decimal">'
            + '</td>'
            + '<td><button class="btn danger js-hdel" data-id="'+h.id+'" data-name="'+esc(h.name)+'">Delete</button></td>'
            + '</tr>';
        });
        html += '</tbody></table></div>'
             +  '<p class="hint" style="margin-top:12px">Edits save when you click out of a box.</p></div>';
        el.innerHTML = html;
        wireHospitalForm();
      }).catch(function(e){
        el.innerHTML = '<div class="card"><div class="err">'+esc(e.message||"Could not load hospitals")+'</div></div>';
      });
  }

  /* ================= IMPORTING A HOSPITAL LIST =================
     Three steps: pick a file, confirm which of their columns means what,
     then import. The middle step is the important one - most people
     already have a list and should not have to rebuild it to match us. */

  var IMP = null;   // { headers, rows, mapping }

  var OUR_FIELDS = [
    { key:"name",       label:"Hospital name", required:true,
      aliases:["hospital name","name","hospital","facility","facility name"] },
    { key:"phone_call", label:"Phone number",
      aliases:["phone (call)","phone call","phone","main phone","telephone","tel","contact"] },
    { key:"phone_red",  label:"Red phone",
      aliases:["red phone","redphone","red","direct line","er phone"] },
    { key:"address",    label:"Address",
      aliases:["address (navigate)","address","street address","location","street"] },
    { key:"door_code",  label:"Door code",
      aliases:["door code","doorcode","door","entry code","keypad","access code"] },
    { key:"lat",        label:"Latitude (ambulance bay)",
      aliases:["latitude","lat"] },
    { key:"lng",        label:"Longitude (ambulance bay)",
      aliases:["longitude","lng","long","lon"] }
  ];
  var SKIP_HEADERS = ["code","specialties (summary)","specialties","summary","notes"];

  function norm(h){ return String(h||"").trim().toLowerCase(); }

  function autoMap(headers, rows){
    return headers.map(function(h, i){
      var n = norm(h);
      if(!n) return "ignore";
      if(n === "hide") return "hide";
      if(SKIP_HEADERS.indexOf(n) > -1) return "ignore";
      for(var f=0; f<OUR_FIELDS.length; f++){
        if(OUR_FIELDS[f].aliases.indexOf(n) > -1) return OUR_FIELDS[f].key;
      }
      // a column of X marks is almost always a capability tick-box
      var ticks = 0, filled = 0;
      for(var r=0; r<rows.length; r++){
        var v = String(rows[r][i] == null ? "" : rows[r][i]).trim().toUpperCase();
        if(!v) continue;
        filled++;
        if(v === "X" || v === "YES" || v === "TRUE" || v === "1") ticks++;
      }
      if(filled && ticks === filled) return "specialty";
      return "ignore";
    });
  }

  function loadTable(headers, rows){
    headers = headers.map(function(h){ return String(h == null ? "" : h).trim(); });
    rows = rows.filter(function(r){
      return r.some(function(c){ return String(c == null ? "" : c).trim() !== ""; });
    });
    if(!rows.length){
      $("imp_out").innerHTML = '<div class="err">That file has headings but no rows.</div>';
      return;
    }
    IMP = { headers:headers, rows:rows, mapping:autoMap(headers, rows) };
    renderMapping();
  }

  function renderMapping(){
    var opts = function(sel){
      var o = '<option value="ignore"'+(sel==="ignore"?" selected":"")+'>Do not import</option>'
            + '<option value="specialty"'+(sel==="specialty"?" selected":"")+'>A specialty (X = has it)</option>'
            + '<option value="hide"'+(sel==="hide"?" selected":"")+'>Hide row when marked X</option>';
      OUR_FIELDS.forEach(function(f){
        o += '<option value="'+f.key+'"'+(sel===f.key?" selected":"")+'>'+esc(f.label)+'</option>';
      });
      return o;
    };

    var hasName = IMP.mapping.indexOf("name") > -1;
    var used = {};
    IMP.mapping.forEach(function(m){ if(m !== "ignore" && m !== "specialty") used[m] = (used[m]||0)+1; });
    var dupes = Object.keys(used).filter(function(k){ return used[k] > 1; });

    var html = '<div class="card"><h2>Check the columns</h2>'
      + '<p class="hint">We have guessed what each of your columns means. Change anything we got '
      + 'wrong. Columns set to \u201Cdo not import\u201D are simply left out.</p>';

    if(!hasName){
      html += '<div class="err">One column must be set to <b>Hospital name</b> before you can import.</div>';
    }
    if(dupes.length){
      html += '<div class="err">Two columns are both set to the same thing. Each of ours can only be used once.</div>';
    }

    html += '<div class="maprow"><b class="small">YOUR COLUMN</b><span></span><b class="small">MEANS</b></div>';

    IMP.headers.forEach(function(h, i){
      var sample = "";
      for(var r=0; r<IMP.rows.length && !sample; r++){
        sample = String(IMP.rows[r][i] == null ? "" : IMP.rows[r][i]).trim();
      }
      html += '<div class="maprow">'
        + '<div class="yours">'+esc(h || "(no heading)")
        +   (sample ? '<div class="sample">e.g. '+esc(sample.slice(0,40))+'</div>' : '')
        + '</div>'
        + '<span class="arrow">\u2192</span>'
        + '<select class="js-map" data-i="'+i+'">'+opts(IMP.mapping[i])+'</select>'
        + '</div>';
    });

    html += '<div class="row" style="margin-top:16px">'
      + '<button id="imp_preview" class="btn primary"'+((!hasName||dupes.length)?" disabled":"")+'>'
      + 'Preview import</button>'
      + '<button id="imp_cancel" class="btn">Start over</button></div></div>';

    $("imp_out").innerHTML = html;
  }

  function buildRows(){
    var map = {}, specCols = [], hideCol = -1;
    IMP.mapping.forEach(function(m, i){
      if(m === "ignore") return;
      if(m === "specialty"){ specCols.push({ i:i, label:IMP.headers[i] }); return; }
      if(m === "hide"){ hideCol = i; return; }
      map[m] = i;
    });

    var out = [], skipped = 0;
    IMP.rows.forEach(function(cells, n){
      var cell = function(i){
        return i === undefined ? "" : String(cells[i] == null ? "" : cells[i]).trim();
      };
      if(hideCol > -1 && cell(hideCol).toUpperCase() === "X"){ skipped++; return; }
      var name = cell(map.name);
      if(!name){ skipped++; return; }

      var specs = [];
      specCols.forEach(function(sc){
        var v = cell(sc.i).toUpperCase();
        if(v === "X" || v === "YES" || v === "TRUE" || v === "1") specs.push(sc.label);
      });

      var lat = parseFloat(cell(map.lat)), lng = parseFloat(cell(map.lng));
      out.push({
        org_id: orgId, name: name,
        phone_call: cell(map.phone_call) || null,
        phone_red:  cell(map.phone_red)  || null,
        address:    cell(map.address)    || null,
        door_code:  cell(map.door_code)  || null,
        lat: isNaN(lat) ? null : lat,
        lng: isNaN(lng) ? null : lng,
        specialties: specs,
        sort_order: (n + 1) * 10
      });
    });
    return { rows:out, skipped:skipped,
             specCols:specCols.map(function(c){ return c.label; }) };
  }

  function doImport(){
    var go = $("imp_go");
    var replace = $("imp_replace") && $("imp_replace").checked;
    if(replace && !confirm("This deletes every hospital currently in this organization, then "
        + "imports " + IMP.ready.length + ". Continue?")) return;

    go.disabled = true; go.textContent = "Importing\u2026";
    var step = replace ? db.from("hospitals").delete().eq("org_id", orgId)
                       : Promise.resolve({ error:null });

    step.then(function(d){
      if(d && d.error) throw d.error;
      return db.from("hospitals").insert(IMP.ready);
    }).then(function(r){
      if(r.error) throw r.error;
      var names = {};
      IMP.ready.forEach(function(x){ x.specialties.forEach(function(sp){ names[sp] = 1; }); });
      var list = Object.keys(names);
      if(!list.length) return { error:null };
      return db.from("hospital_specialties").upsert(
        list.map(function(n, i){
          return { org_id:orgId, name:n, label:n, is_key:true, sort_order:(i+1)*10 };
        }), { onConflict:"org_id,name", ignoreDuplicates:true });
    }).then(function(r){
      if(r && r.error) throw r.error;
      toast("Imported " + IMP.ready.length + " hospitals");
      IMP = null;
      renderHospitals();
    }).catch(function(e){
      go.disabled = false; go.textContent = "Import";
      $("imp_out").innerHTML = '<div class="card"><div class="err">'
        + esc(e.message || "Import failed") + '</div>'
        + '<button id="imp_cancel" class="btn" style="margin-top:12px">Start over</button></div>';
    });
  }

  function downloadTemplate(){
    var headers = ["Hospital Name","Phone (Call)","Red Phone","Address","Door Code",
                   "Latitude","Longitude","Trauma","Stroke","Cardiac","Paediatric"];
    var examples = [
      ["Example General Hospital","713-555-1000","713-555-1911",
       "100 Main Street, Yourtown","4412#","29.709600","-95.397100","X","X","X",""],
      ["Example Children's Hospital","713-555-2000","",
       "200 Second Street, Yourtown","","","","","","","X"]
    ];
    var csv = [headers].concat(examples).map(function(r){
      return r.map(function(c){
        return /[",\n]/.test(c) ? '"'+String(c).replace(/"/g,'""')+'"' : c;
      }).join(",");
    }).join("\r\n");

    var blob = new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "hospital-list-template.csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast("Template downloaded");
  }

  function readFile(file){
    $("imp_out").innerHTML = '<div class="card"><div class="empty">Reading '
      + esc(file.name) + '\u2026</div></div>';
    var fr = new FileReader();
    fr.onerror = function(){
      $("imp_out").innerHTML = '<div class="card"><div class="err">Could not read that file.</div></div>';
    };
    fr.onload = function(e){
      try{
        var wb = XLSX.read(e.target.result, { type:"array" });
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var grid = XLSX.utils.sheet_to_json(sheet, { header:1, blankrows:false, defval:"" });
        if(!grid.length){ throw new Error("That file looks empty."); }
        loadTable(grid[0], grid.slice(1));
      }catch(err){
        $("imp_out").innerHTML = '<div class="card"><div class="err">'
          + esc(err.message || "Could not understand that file.")
          + ' Try saving it as .csv and uploading again.</div></div>';
      }
    };
    fr.readAsArrayBuffer(file);
  }

  function readPaste(text){
    if(!text.trim()){ toast("Nothing pasted yet."); return; }
    try{
      var wb = XLSX.read(text, { type:"string" });
      var grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],
                    { header:1, blankrows:false, defval:"" });
      if(grid.length < 2) throw new Error("Paste the heading row and at least one hospital.");
      loadTable(grid[0], grid.slice(1));
    }catch(err){
      $("imp_out").innerHTML = '<div class="card"><div class="err">'
        + esc(err.message || "Could not read that.") + '</div></div>';
    }
  }

  var PDF_SCALE_WIDTH = 1400;   // enough to read when zoomed on a phone
  var PDF_QUALITY     = 0.82;

  function processPdf(file, name, version){
    var go = $("pr_go");
    go.disabled = true;
    $("pr_progress").classList.remove("hidden");
    setProgress(0, 1, "Opening the PDF\u2026");

    var setId = null, pdf = null, total = 0;

    var reader = new FileReader();
    reader.onerror = function(){ stop("Could not read that file."); };
    reader.onload = function(e){
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

      pdfjsLib.getDocument({ data:new Uint8Array(e.target.result) }).promise
        .then(function(doc){
          pdf = doc; total = doc.numPages;
          setProgress(0, total, "Found " + total + " pages. Creating the book\u2026");
          return db.from("protocol_sets").insert({
            org_id: orgId, name: name, version: version,
            page_count: total, is_published: false
          }).select().single();
        })
        .then(function(r){
          if(r.error) throw r.error;
          setId = r.data.id;
          return runPages();
        })
        .then(function(){
          return pdf.getOutline().catch(function(){ return null; });
        })
        .then(function(outline){ return saveOutline(outline, setId, pdf); })
        .then(function(){
          setProgress(total, total, "Done. " + total + " pages ready.");
          go.disabled = false;
          toast("Uploaded " + name);
          renderProtocols();
        })
        .catch(function(err){ stop(err && err.message ? err.message : "Something went wrong."); });
    };
    reader.readAsArrayBuffer(file);

    function stop(msg){
      go.disabled = false;
      $("pr_err").innerHTML = '<div class="err" style="margin-top:12px">'+esc(msg)+'</div>';
      setProgress(0, 1, "Stopped.");
    }

    /* one page at a time: render, read the text, upload, record */
    function runPages(){
      var n = 0;
      function next(){
        n++;
        if(n > total) return Promise.resolve();
        setProgress(n-1, total, "Page " + n + " of " + total + "\u2026");
        return onePage(n).then(next);
      }
      return next();
    }

    function onePage(n){
      return pdf.getPage(n).then(function(page){
        var vp1 = page.getViewport({ scale:1 });
        var scale = PDF_SCALE_WIDTH / vp1.width;
        var vp = page.getViewport({ scale: scale });
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
        var ctx = canvas.getContext("2d");

        return page.render({ canvasContext:ctx, viewport:vp }).promise
          .then(function(){ return page.getTextContent(); })
          .then(function(tc){
            var text = tc.items.map(function(i){ return i.str; }).join(" ")
                         .replace(/\s+/g," ").trim();
            return new Promise(function(resolve, reject){
              canvas.toBlob(function(blob){
                if(!blob) return reject(new Error("Could not turn page " + n + " into an image."));
                var path = orgId + "/protocols/" + setId + "/p"
                         + String(n).padStart(4,"0") + ".jpg";
                db.storage.from("org-media").upload(path, blob, {
                  contentType:"image/jpeg", upsert:true
                }).then(function(up){
                  if(up.error) return reject(new Error(
                    "Upload blocked on page " + n + ": " + up.error.message));
                  return db.from("protocol_pages").insert({
                    org_id: orgId, set_id: setId, page_number: n,
                    image_path: path, body_text: text
                  });
                }).then(function(ins){
                  if(ins && ins.error) return reject(ins.error);
                  canvas.width = canvas.height = 0;   // let the memory go
                  resolve();
                }).catch(reject);
              }, "image/jpeg", PDF_QUALITY);
            });
          });
      });
    }

    /* if the PDF has bookmarks, they become the contents list */
    function saveOutline(outline, sid, doc){
      if(!outline || !outline.length) return Promise.resolve();
      setProgress(total, total, "Reading the contents list\u2026");
      var entries = [], order = 0;

      function walk(items, depth){
        return items.reduce(function(chain, it){
          return chain.then(function(){
            return Promise.resolve()
              .then(function(){ return doc.getDestination(it.dest); })
              .then(function(dest){
                if(!dest) return null;
                return doc.getPageIndex(dest[0]);
              })
              .then(function(idx){
                if(idx != null){
                  order++;
                  entries.push({ org_id:orgId, set_id:sid, name:it.title,
                                 page_number: idx + 1, sort_order: order });
                }
                if(it.items && it.items.length && depth < 2) return walk(it.items, depth+1);
              })
              .catch(function(){ /* a bad bookmark should not stop the upload */ });
          });
        }, Promise.resolve());
      }

      return walk(outline, 0).then(function(){
        if(!entries.length) return null;
        return db.from("protocol_toc").insert(entries);
      });
    }
  }

      + '<div class="switch"><b>Show dates of birth to all members</b>'
      +   '<button class="toggle js-orgtog" data-f="directory_shows_dob" aria-pressed="'
      +   (o.directory_shows_dob?"true":"false")+'"><span></span></button></div>'
      + '<div class="switch"><b>Show home addresses to all members</b>'
      +   '<button class="toggle js-orgtog" data-f="directory_shows_address" aria-pressed="'
      +   (o.directory_shows_address?"true":"false")+'"><span></span></button></div>'
      + '</div>'

      + '<button id="s_save" class="btn primary">Save changes</button>';

    $("s_save").addEventListener("click", saveSettings);
  }

  function saveSettings(){
    var b = $("s_save"); b.disabled = true;
    var code = $("s_code").value.trim().toLowerCase();
    if(!/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(code)){
      b.disabled = false;
      toast("Code must be lowercase letters, numbers and dashes only.");
      return;
    }
    var dom = $("s_domain").value.trim().toLowerCase().replace(/^@/,"");
    db.from("orgs").update({
      code: code,
      name: $("s_name").value.trim(),
      app_name: $("s_appname").value.trim() || null,
      brand_primary: $("s_brand").value,
      login_subtext: $("s_sub").value.trim() || null,
      dispatch_phone: $("s_dispatch").value.trim() || null,
      medical_control_phone: $("s_medcon").value.trim() || null,
      email_domains: dom ? [dom] : [],
      auth_mode: $("s_auth").value
    }).eq("id", orgId).select().then(function(r){
      b.disabled = false;
      if(r.error) return oops(r.error);
      if(r.data && r.data[0]){
        for(var i=0;i<orgs.length;i++){ if(orgs[i].id===orgId) orgs[i]=r.data[0]; }
        org = r.data[0];
      }
      $("orgPick").innerHTML = orgs.map(function(o){
        return '<option value="'+o.id+'">'+esc(o.name)+' ('+esc(o.code)+')</option>';
      }).join("");
      $("orgPick").value = orgId;
      toast("Saved");
    }).catch(function(e){ b.disabled = false; oops(e); });
  }

  /* ================= FEATURES ================= */
  function renderFeatures(){
    var el = $("tab-features");
    el.innerHTML = '<div class="card"><div class="empty">Loading\u2026</div></div>';

    Promise.all([
      db.from("features").select("key,name,description,category,is_billable").order("sort_order"),
      db.from("v_org_features").select("feature_key,enabled,overridden").eq("org_id", orgId)
    ]).then(function(r){
      if(r[0].error) throw r[0].error;
      var state = {};
      (r[1].data||[]).forEach(function(f){ state[f.feature_key] = f.enabled; });

      var html = '<div class="card"><h2>Features</h2>'
        + '<p class="hint">Switching one off hides its tile for everyone in this organization.</p>'
        + (isSuper ? '' : '<div class="warn">Only the platform owner can change these. '
                        + 'Contact them to add a feature to your plan.</div>');

      (r[0].data||[]).forEach(function(f){
        html += '<div class="switch"><span><b>'+esc(f.name)+'</b>'
             +  '<div class="small">'+esc(f.description||"")+'</div></span>'
             +  '<button class="toggle js-feat" data-k="'+esc(f.key)+'" aria-pressed="'
             +  (state[f.key]?"true":"false")+'"'+(isSuper?"":" disabled")+'><span></span></button></div>';
      });
      html += '</div>';
      el.innerHTML = html;
    }).catch(function(e){
      el.innerHTML = '<div class="card"><div class="err">'+esc(e.message||"Could not load features")+'</div></div>';
    });
  }

  /* ================= one click handler ================= */
  document.addEventListener("click", function(e){
    var t = e.target;
    if(!t || !t.closest) return;

    var ap = t.closest(".js-approve");
    if(ap){
      db.from("memberships").update({status:"active"}).eq("id", ap.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Approved"); renderMembers(); });
      return;
    }
    var su = t.closest(".js-suspend");
    if(su){
      if(!confirm("Suspend this member? They lose access immediately and all their devices are signed out.")) return;
      db.from("memberships").update({status:"suspended"}).eq("id", su.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Suspended"); renderMembers(); });
      return;
    }
    var hd = t.closest(".js-hdel");
    if(hd){
      if(!confirm("Delete " + hd.getAttribute("data-name") + "? This cannot be undone.")) return;
      db.from("hospitals").delete().eq("id", hd.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Deleted"); renderHospitals(); });
      return;
    }
    var ot = t.closest(".js-orgtog");
    if(ot){
      var on = ot.getAttribute("aria-pressed") !== "true";
      var patch = {}; patch[ot.getAttribute("data-f")] = on;
      db.from("orgs").update(patch).eq("id", orgId).then(function(r){
        if(r.error) return oops(r.error);
        ot.setAttribute("aria-pressed", on ? "true" : "false");
        org[ot.getAttribute("data-f")] = on;
        toast("Saved");
      });
      return;
    }
    var ps = t.closest(".js-pubset");
    if(ps){
      var on = ps.getAttribute("aria-pressed") !== "true";
      db.from("protocol_sets").update({is_published:on}).eq("id", ps.getAttribute("data-id"))
        .then(function(r){
          if(r.error) return oops(r.error);
          ps.setAttribute("aria-pressed", on ? "true" : "false");
          toast(on ? "Members can now see it" : "Hidden from members");
        });
      return;
    }
    var ds = t.closest(".js-delset");
    if(ds){
      if(!confirm("Delete \u201C" + ds.getAttribute("data-name")
          + "\u201D and all its pages? This cannot be undone.")) return;
      db.from("protocol_sets").delete().eq("id", ds.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Deleted"); renderProtocols(); });
      return;
    }

    if(t.id === "imp_preview"){ renderPreview(); return; }
    if(t.id === "imp_back"){ renderMapping(); return; }
    if(t.id === "imp_go"){ doImport(); return; }
    if(t.id === "imp_cancel"){ IMP = null; renderHospitals(); return; }

    var ft = t.closest(".js-feat");
    if(ft && !ft.disabled){
      var want = ft.getAttribute("aria-pressed") !== "true";
      db.from("org_features")
        .upsert({org_id:orgId, feature_key:ft.getAttribute("data-k"), enabled:want},
                {onConflict:"org_id,feature_key"})
        .then(function(r){
          if(r.error) return oops(r.error);
          ft.setAttribute("aria-pressed", want ? "true" : "false");
          toast(want ? "Switched on" : "Switched off");
        });
      return;
    }
  });

  /* inline edits save on blur */
  document.addEventListener("blur", function(e){
    var i = e.target;
    if(!i.classList || !i.classList.contains("js-h")) return;
    var f = i.getAttribute("data-f"), v = i.value.trim();
    var patch = {};
    if(f === "lat" || f === "lng"){
      if(v && isNaN(parseFloat(v))){ toast("Coordinates must be numbers."); return; }
      patch[f] = v ? parseFloat(v) : null;
    } else {
      patch[f] = v || null;
    }
    db.from("hospitals").update(patch).eq("id", i.getAttribute("data-id"))
      .then(function(r){ if(r.error) oops(r.error); else toast("Saved"); });
  }, true);

  document.addEventListener("change", function(e){
    var s = e.target;
    if(s.classList && s.classList.contains("js-map")){
      IMP.mapping[parseInt(s.getAttribute("data-i"), 10)] = s.value;
      renderMapping();
      return;
    }
    if(!s.classList || !s.classList.contains("js-role")) return;
    db.from("memberships").update({role:s.value}).eq("id", s.getAttribute("data-id"))
      .then(function(r){ if(r.error) return oops(r.error); toast("Role updated"); });
  });

  /* ================= new organization ================= */
  $("newOrgBtn").addEventListener("click", function(){
    var name = prompt("Organization name (e.g. Hatzalah of Lakewood)");
    if(!name) return;
    var code = prompt("Short code members will type (lowercase, e.g. lakewood)");
    if(!code) return;
    var email = prompt("Email address of the person who will run it");
    if(!email) return;
    var domain = prompt("Their email domain, or leave blank (e.g. hatzalahlakewood.org)") || null;

    db.rpc("new_org", {
      p_code: code.trim().toLowerCase(), p_name: name.trim(),
      p_contact_email: email.trim().toLowerCase(), p_domain: domain ? domain.trim().toLowerCase() : null
    }).then(function(r){
      if(r.error) return oops(r.error);
      toast("Created " + name);
      boot();
    }).catch(oops);
  });

  db.auth.getSession().then(function(r){
    if(r && r.data && r.data.session) boot();
  }).catch(function(){});
})();
</script>
</body>
</html>
