<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Hatzalah Platform</title>
<style>
  :root{
    --brand:#143D75; --brand-deep:#0D2A52; --ink:#12161C; --muted:#5C6675;
    --line:#DFE4EC; --bg:#F4F6FA; --card:#fff; --red:#B3121B; --green:#1B7F3B;
    --amber:#8A6A1A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .hidden{display:none !important}
  button,input,select,textarea{font:inherit}
  :focus-visible{outline:2px solid #7FA8E0;outline-offset:2px}

  /* sign in */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:var(--brand);padding:24px}
  #login .box{width:100%;max-width:380px;color:#fff}
  #login h1{font-size:23px;margin:0 0 4px;font-weight:650}
  #login p{margin:0 0 24px;opacity:.7}
  .f{margin-bottom:13px}
  .f label{display:block;font-size:13px;margin-bottom:5px;opacity:.8}
  .f textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .f input,.f select,.f textarea{width:100%;padding:11px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink);font-size:15px}
  #login .f input{border-color:rgba(255,255,255,.25);background:rgba(0,0,0,.22);color:#fff}
  .btn{padding:11px 16px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-weight:600;cursor:pointer}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.danger{background:#FDECEC;border-color:#F0BEC0;color:var(--red)}
  .btn.ok{background:#EAF4EC;border-color:#B9DCC4;color:var(--green)}
  .btn:disabled{opacity:.5;cursor:default}
  #login .btn{width:100%;background:#fff;color:var(--brand);border:0;padding:13px}
  .err{background:#FDECEC;border:1px solid #F0BEC0;color:var(--red);
    padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:13px}
  #login .err{background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.3);color:#FFDDDF}

  /* chrome */
  header{background:var(--brand);color:#fff;padding:12px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:150px}
  header select{padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.22);color:#fff;font-size:14px;max-width:230px}
  header .btn{background:rgba(255,255,255,.14);border:0;color:#fff;padding:7px 12px;font-size:14px}
  nav{background:var(--brand-deep);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  nav button{background:none;border:0;color:rgba(255,255,255,.72);padding:12px 14px;
    font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
    border-bottom:3px solid transparent}
  nav button[aria-current="true"]{color:#fff;border-bottom-color:#fff;font-weight:650}
  main{padding:18px;max-width:1000px;margin:0 auto}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
    background:#12161C;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.25)}

  /* content */
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 3px;font-size:16px}
  .card .hint{margin:0 0 14px;color:var(--muted);font-size:13.5px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
  table input{width:100%;min-width:0;padding:8px 9px;border-radius:7px;
    border:1px solid var(--line);font-size:13.5px}
  td.actions{width:1%;white-space:nowrap;text-align:right}
  .xbtn{width:32px;height:32px;padding:0;border-radius:8px;background:#FDECEC;
    border:1px solid #F0BEC0;color:var(--red);font-size:16px;line-height:1;font-weight:700}
  .coords{display:flex;gap:5px;min-width:186px}
  .coords input{width:88px;flex:none}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);padding:8px 9px;border-bottom:2px solid var(--line)}
  td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:5px}
  .pill.pending{background:#FFF3D4;color:var(--amber)}
  .pill.active{background:#EAF4EC;color:var(--green)}
  .pill.suspended{background:#FDECEC;color:var(--red)}
  .pill.admin{background:#EAF0F9;color:#28456F}
  .small{font-size:13px;color:var(--muted)}
  .warn{background:#FFF8E6;border:1px solid #E8CE86;color:#6B520C;
    padding:10px 12px;border-radius:9px;font-size:13.5px;margin-bottom:13px}
  .empty{text-align:center;color:var(--muted);padding:30px}
  .bar-outer{height:9px;background:#E3E8F0;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar-inner{height:100%;background:var(--green);width:0;transition:width .2s}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted)}
  .steps{display:flex;flex-direction:column;gap:14px;margin-bottom:4px}
  .step{display:flex;gap:12px;align-items:flex-start}
  .step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700}
  .linklike{background:none;border:0;color:var(--brand);text-decoration:underline;
    padding:0;cursor:pointer;font-size:13px}
  .maprow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--line)}
  .maprow:last-of-type{border-bottom:0}
  .maprow .arrow{color:var(--muted)}
  .maprow .yours{font-weight:600;word-break:break-word}
  .maprow .sample{font-size:12px;color:var(--muted);font-weight:400}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 0;border-bottom:1px solid var(--line)}
  .switch:last-child{border-bottom:0}
  .switch b{font-weight:600;font-size:14.5px}
  .toggle{width:48px;height:27px;border-radius:99px;border:0;background:#CBD2DD;
    position:relative;cursor:pointer;flex:none}
  .toggle[aria-pressed="true"]{background:var(--green)}
  .toggle span{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
    background:#fff;transition:transform .16s}
  .toggle[aria-pressed="true"] span{transform:translateX(21px)}
  .toggle:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>

<section id="login">
  <div class="box">
    <h1>Platform Admin</h1>
    <p>Sign in to manage organizations</p>
    <div id="loginErr" class="err hidden"></div>
    <div class="f"><label for="email">Email</label>
      <input id="email" type="email" autocomplete="username"></div>
    <div class="f"><label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn">Sign in</button>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <h1>Admin</h1>
    <select id="orgPick"></select>
    <button id="newOrgBtn" class="btn hidden">New organization</button>
    <button id="signout" class="btn">Sign out</button>
  </header>
  <nav>
    <button data-tab="members"   aria-current="true">Members</button>
    <button data-tab="hospitals">Hospitals</button>
    <button data-tab="protocols">Protocols</button>
    <button data-tab="tiles">Home screen</button>
    <button data-tab="content">Content</button>
    <button data-tab="media">Images</button>
    <button data-tab="settings">Organization</button>
    <button data-tab="features">Features</button>
  </nav>
  <main>
    <div id="tab-members"></div>
    <div id="tab-hospitals" class="hidden"></div>
    <div id="tab-protocols" class="hidden"></div>
    <div id="tab-tiles" class="hidden"></div>
    <div id="tab-content" class="hidden"></div>
    <div id="tab-media" class="hidden"></div>
    <div id="tab-settings" class="hidden"></div>
    <div id="tab-features" class="hidden"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://fwjxskdgzzfgqhnabrpa.supabase.co";
  var SUPABASE_KEY = "sb_publishable_vbsCkIpZsk7bh-PjbhIYSw__t9MtXJi";

  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var $  = function(id){ return document.getElementById(id); };

  var isSuper = false, orgs = [], orgId = null, org = null;
  var TABS = ["members","hospitals","protocols","tiles","content","media","settings","features"];

  /* Remember where you were. Refreshing in the middle of data entry and
     landing back on the first tab is maddening. */
  function readState(){
    var h = (location.hash || "").replace(/^#/,"");
    var parts = {};
    h.split("&").forEach(function(kv){
      var p = kv.split("=");
      if(p[0]) parts[p[0]] = decodeURIComponent(p[1] || "");
    });
    return parts;
  }
  function writeState(){
    var h = "tab=" + tab + (orgId ? "&org=" + orgId : "");
    if(location.hash.replace(/^#/,"") !== h){
      history.replaceState(null, "", "#" + h);
    }
    try{ localStorage.setItem("hzadmin_state", JSON.stringify({tab:tab, org:orgId})); }catch(e){}
  }
  function savedState(){
    var st = readState();
    if(!st.tab || !st.org){
      try{
        var ls = JSON.parse(localStorage.getItem("hzadmin_state") || "{}");
        st.tab = st.tab || ls.tab; st.org = st.org || ls.org;
      }catch(e){}
    }
    return st;
  }

  var tab = (function(){
    var t = savedState().tab;
    return TABS.indexOf(t) > -1 ? t : "members";
  })();

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }
  function oops(e){ toast(e && e.message ? e.message : "Something went wrong"); }

  /* ---------------- sign in ---------------- */
  $("loginBtn").addEventListener("click", function(){
    var b = $("loginBtn");
    $("loginErr").classList.add("hidden");
    b.disabled = true; b.textContent = "Signing in\u2026";
    db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value })
      .then(function(r){
        b.disabled = false; b.textContent = "Sign in";
        if(r.error){ $("loginErr").textContent = r.error.message;
                     $("loginErr").classList.remove("hidden"); return; }
        boot();
      }).catch(function(){
        b.disabled = false; b.textContent = "Sign in";
        $("loginErr").textContent = "Could not reach the server.";
        $("loginErr").classList.remove("hidden");
      });
  });
  $("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") $("loginBtn").click(); });
  $("signout").addEventListener("click", function(){
    db.auth.signOut().then(function(){ location.reload(); });
  });

  /* ---------------- boot ---------------- */
  function boot(){
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");

    db.auth.getUser().then(function(u){
      var uid = u && u.data && u.data.user ? u.data.user.id : null;
      return db.from("profiles").select("is_super_admin").eq("id", uid).maybeSingle();
    }).then(function(r){
      isSuper = !!(r.data && r.data.is_super_admin);
      $("newOrgBtn").classList.toggle("hidden", !isSuper);
      return db.from("orgs").select("*").order("name");
    }).then(function(r){
      orgs = r.data || [];
      if(!orgs.length){
        $("tab-members").innerHTML = '<div class="card"><div class="empty">'
          + 'You are not an administrator of any organization.</div></div>';
        return;
      }
      $("orgPick").innerHTML = orgs.map(function(o){
        return '<option value="'+o.id+'">'+esc(o.name)+' ('+esc(o.code)+')</option>';
      }).join("");
      var want = savedState().org;
      var found = null;
      for(var i=0;i<orgs.length;i++){ if(orgs[i].id === want) found = orgs[i].id; }
      showTab(tab);
      selectOrg(found || orgs[0].id);
    }).catch(oops);
  }

  function selectOrg(id){
    orgId = id;
    for(var i=0;i<orgs.length;i++){ if(orgs[i].id === id) org = orgs[i]; }
    $("orgPick").value = id;
    writeState();
    render();
  }
  $("orgPick").addEventListener("change", function(){ selectOrg($("orgPick").value); });

  function showTab(t){
    tab = TABS.indexOf(t) > -1 ? t : "members";
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(x){
      x.setAttribute("aria-current", x.getAttribute("data-tab") === tab ? "true" : "false");
    });
    TABS.forEach(function(n){ $("tab-"+n).classList.toggle("hidden", n !== tab); });
    writeState();
  }

  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.addEventListener("click", function(){
      showTab(b.getAttribute("data-tab"));
      render();
    });
  });

  function render(){
    if(!org) return;
    if(tab === "members")   renderMembers();
    if(tab === "hospitals") renderHospitals();
    if(tab === "protocols") renderProtocols();
    if(tab === "tiles") renderTiles();
    if(tab === "content") renderContent();
    if(tab === "media") renderMedia();
    if(tab === "settings")  renderSettings();
    if(tab === "features")  renderFeatures();
  }

  /* ================= MEMBERS =================
     This shows the ROSTER - everyone in the organization, whether or not
     they have ever opened the app. A person appears here the moment you
     import them, and gains a tick once they sign in for the first time.
     Anyone who signs in without a place on the roster is listed
     underneath, waiting to be given a unit. */

  function renderMembers(){
    var el = $("tab-members");
    el.innerHTML = '<div class="card"><div class="empty">Loading\u2026</div></div>';

    Promise.all([
      db.from("roster_slots").select("*").eq("org_id", orgId).order("unit_number"),
      db.from("memberships")
        .select("id,user_id,role,status,unit_number,display_name,is_dispatcher,duty_status")
        .eq("org_id", orgId),
      db.from("profiles").select("id,full_name,email")
    ]).then(function(r){
      if(r[0].error) throw r[0].error;
      var roster = r[0].data || [], mems = r[1].data || [], people = {};
      (r[2].data || []).forEach(function(p){ people[p.id] = p; });

      var byUnit = {};
      mems.forEach(function(m){
        if(m.unit_number) byUnit[String(m.unit_number).toLowerCase()] = m;
      });
      var unplaced = mems.filter(function(m){ return !m.unit_number; });

      var signedIn = roster.filter(function(s){
        return byUnit[String(s.unit_number).toLowerCase()];
      }).length;
      var freeSlots = roster.filter(function(s){
        return !byUnit[String(s.unit_number).toLowerCase()];
      });

      var html = "";

      if(unplaced.length){
        html += '<div class="warn"><b>'+unplaced.length+' waiting to be given a unit.</b> '
             +  'They signed in but were not on the roster. See the bottom of this page.</div>';
      }

      html += '<div class="card"><h2>Roster</h2>'
        + '<p class="hint">'+roster.length+' people. '+signedIn+' have signed in at least once. '
        + 'Everyone else is set up and waiting for their first sign-in.</p>'
        + '<p class="hint">The <b>email</b> matters: when someone signs in with the address on '
        + 'their row, they go straight into that unit with these settings. Get it wrong and they '
        + 'land in the waiting list instead.</p>';

      if(!roster.length){
        html += '<div class="empty">No roster yet. Import your Members sheet below.</div></div>';
      } else {
        html += '<div class="scroller"><table><thead><tr>'
          + '<th style="width:76px">Unit</th><th>Name</th><th>Email</th><th style="width:110px">Role</th>'
          + '<th style="width:80px">Dispatch</th><th style="width:110px">Duty</th>'
          + '<th style="width:96px">Signed in</th><th></th></tr></thead><tbody>';

        roster.forEach(function(s){
          var m = byUnit[String(s.unit_number).toLowerCase()];
          html += '<tr>'
            + '<td><input class="js-rs" data-id="'+s.id+'" data-f="unit_number" '
            +   'value="'+esc(s.unit_number)+'" style="width:68px"></td>'
            + '<td><input class="js-rs" data-id="'+s.id+'" data-f="display_name" '
            +   'value="'+esc(s.display_name||"")+'"></td>'
            + '<td><input class="js-rs" data-id="'+s.id+'" data-f="email" '
            +   'value="'+esc(s.email||"")+'" placeholder="not set"></td>'
            + '<td><select class="js-rsel" data-id="'+s.id+'" data-f="role">'
            +   ["member","admin","guest"].map(function(x){
                  return '<option value="'+x+'"'+(s.role===x?" selected":"")+'>'+x+'</option>';
                }).join("")
            + '</select></td>'
            + '<td style="text-align:center"><input type="checkbox" class="js-rchk" '
            +   'data-id="'+s.id+'" data-f="is_dispatcher" '+(s.is_dispatcher?"checked":"")+'></td>'
            + '<td><input class="js-rs" data-id="'+s.id+'" data-f="duty_status" '
            +   'value="'+esc(s.duty_status||"")+'" style="width:100px"></td>'
            + '<td>' + (m
                ? '<span class="pill active">yes</span>'
                : '<span class="pill pending">not yet</span>') + '</td>'
            + '<td class="actions"><button class="xbtn js-rdel" data-id="'+s.id+'" '
            +   'data-name="'+esc(s.unit_number)+'" title="Remove from roster">\u00D7</button></td>'
            + '</tr>';
        });
        html += '</tbody></table></div>'
          + '<p class="hint" style="margin-top:12px">Changes save as you make them. Editing a row '
          + 'here changes what a person gets the next time they open the app.</p></div>';
      }

      /* people who signed in but have no unit */
      if(unplaced.length){
        html += '<div class="card"><h2>Waiting for a unit</h2>'
          + '<p class="hint">These people signed in with a valid organization email but were not '
          + 'on the roster. Give them a unit and they get its role and settings straight away.</p>'
          + '<div class="scroller"><table><thead><tr><th>Who</th><th>Email</th>'
          + '<th>Give them</th><th></th></tr></thead><tbody>';

        unplaced.forEach(function(m){
          var p = people[m.user_id] || {};
          html += '<tr>'
            + '<td><b>'+esc(m.display_name || p.full_name || "\u2014")+'</b></td>'
            + '<td class="small">'+esc(p.email||"")+'</td>'
            + '<td><select class="js-assign" data-m="'+m.id+'">'
            +   '<option value="">Choose a unit\u2026</option>'
            +   freeSlots.map(function(s){
                  return '<option value="'+s.id+'">'+esc(s.unit_number)
                    + (s.display_name ? " \u00B7 " + esc(s.display_name) : "") + '</option>';
                }).join("")
            + '</select></td>'
            + '<td class="actions"><button class="btn danger js-reject" data-id="'+m.id+'" '
            +   'style="padding:7px 11px;font-size:13px">Remove</button></td>'
            + '</tr>';
        });
        html += '</tbody></table></div></div>';
      }

      html += '<div class="card"><h2>Import your roster</h2>'
        + '<p class="hint">Upload your Members sheet. Recognised headings: First Name, Last Name, '
        + 'Unit, Email, Admin, Dispatcher, Active, Status. Admin and Dispatcher are separate \u2014 '
        + 'a person can be either, both or neither.</p>'
        + '<p class="hint">Importing again updates people by unit number rather than duplicating '
        + 'them, so it is safe to re-upload a corrected sheet.</p>'
        + '<div class="f"><input id="mi_file" type="file" accept=".csv,.xlsx,.xls"></div>'
        + '<div id="mi_out"></div></div>';

      el.innerHTML = html;
      wireMemberImport();
    }).catch(function(e){
      el.innerHTML = '<div class="card"><div class="err">'
        + esc(e.message||"Could not load the roster") + '</div></div>';
    });
  }

  /* ---------- importing a roster ---------- */
  function wireMemberImport(){
    var f = $("mi_file");
    if(!f) return;
    f.addEventListener("change", function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var out = $("mi_out");
      out.innerHTML = '<div class="empty">Reading\u2026</div>';
      var fr = new FileReader();
      fr.onload = function(ev){
        try{
          var wb = XLSX.read(ev.target.result, { type:"array" });
          var grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],
                       { header:1, blankrows:false, defval:"" });
          var head = grid[0].map(function(h){ return String(h||"").trim().toLowerCase(); });
          function col(){
            for(var i=0;i<arguments.length;i++){
              var k = head.indexOf(arguments[i]);
              if(k > -1) return k;
            }
            return -1;
          }
          var cF = col("first name","first"), cL = col("last name","last"),
              cU = col("unit","unit #"), cA = col("admin"),
              cD = col("dispatcher"), cAc = col("active"), cS = col("status"),
              cE = col("email","email address","e-mail");
          if(cU < 0){ throw new Error("No column named Unit was found."); }

          var yes = function(v){
            return ["x","yes","true","1"].indexOf(String(v||"").trim().toLowerCase()) > -1;
          };
          var rows = [];
          grid.slice(1).forEach(function(r){
            var unit = String(r[cU]||"").trim();
            if(!unit) return;
            var nm = ((cF>-1?String(r[cF]||"").trim():"") + " " +
                      (cL>-1?String(r[cL]||"").trim():"")).trim();
            rows.push({
              unit_number: unit,
              display_name: nm || null,
              email: (cE>-1 ? String(r[cE]||"").trim().toLowerCase() : "") || null,
              role: (cA>-1 && yes(r[cA])) ? "admin" : "member",
              is_dispatcher: cD>-1 ? yes(r[cD]) : false,
              status: (cAc<0 || yes(r[cAc])) ? "active" : "suspended",
              duty_status: cS>-1 ? (String(r[cS]||"").trim() || null) : null
            });
          });
          if(!rows.length) throw new Error("No rows with a unit number.");

          var admins = rows.filter(function(x){ return x.role === "admin"; }).length;
          var disps  = rows.filter(function(x){ return x.is_dispatcher; }).length;

                  + '</td><td>'+x.role+'</td><td>'+(x.is_dispatcher?"yes":"\u2014")
                  + '</td><td>'+esc(x.duty_status||"\u2014")+'</td></tr>'; }).join("")

            + (rows.length>6 ? '<p class="hint">First 6 of '+rows.length+'.</p>' : '')
            + '<button id="mi_go" class="btn primary" style="margin-top:12px">'
            + 'Import '+rows.length+' people</button>';
          MEMBER_ROWS = rows;
        }catch(err){
          out.innerHTML = '<div class="err">'+esc(err.message||"Could not read that file.")+'</div>';
        }
      };
      fr.readAsArrayBuffer(file);
    });

  var TOC_SET = null;

  function openToc(setId, setName){
    TOC_SET = setId;
    db.from("protocol_toc").select("name,volume,page_number,page_label,sort_order")
      .eq("set_id", setId).order("sort_order")

          + '<p class="hint">Paste the book\u2019s own contents page. One entry per line, with the '
          + 'page number at the end:</p>'
          + '<pre class="mono" style="background:#F4F6FA;padding:11px;border-radius:9px;'
          +   'white-space:pre-wrap;margin:0 0 13px">Cardiac\n'
          +   '6.03  Chest Pain    47\n'
          +   '6.04  Cardiac Arrest    52\n'
          +   'Respiratory\n'
          +   '7.01  Asthma    61</pre>'
          + '<p class="hint">A line with no page number becomes a heading for the ones under it.</p>'
          + '<div class="f"><textarea id="toc_data" rows="10" placeholder="Paste the contents here">'
          + esc(existing.map(function(e){
              return (e.volume ? "" : "") + e.name + "\t" + e.page_number;
            }).join("\n"))
          + '</textarea></div>'
          + '<div class="row"><button id="toc_check" class="btn primary">Check it</button>'
          +   '<button id="toc_save" class="btn ok hidden">Save contents</button>'
          +   '<button id="toc_back" class="btn">Back</button></div>'
          + '<div id="toc_out" style="margin-top:13px">'
          +   (existing.length ? '<div class="warn">'+existing.length
                + ' entries saved at the moment.</div>' : '')
          + '</div></div>';
      }).catch(oops);
  }

  function parseToc(text){
    var lines = text.replace(/\r/g,"").split("\n");
    var out = [], volume = null, order = 0, bad = 0;

    lines.forEach(function(raw){
      var line = raw.trim();
      if(!line) return;

      // a page number at the end of the line, possibly after dot leaders
      var m = line.match(/^(.*?)[\s.\u2026\t]+(\d{1,4})$/);
      if(!m){
        // no page number: this is a section heading
        if(line.length <= 60){ volume = line; }
        else { bad++; }
        return;
      }
      var name = m[1].replace(/[.\u2026\s]+$/,"").trim();
      var page = parseInt(m[2], 10);
      if(!name || !page){ bad++; return; }
      order++;
      out.push({ org_id:orgId, set_id:TOC_SET, name:name, volume:volume,
                 page_number:page, sort_order:order });
    });
    return { rows:out, bad:bad };
  }

  function checkToc(){
    var r = parseToc($("toc_data").value);
    var out = $("toc_out");
    if(!r.rows.length){
      out.innerHTML = '<div class="err">No entries found. Each line needs a page number at the end.</div>';
      $("toc_save").classList.add("hidden");
      return;
    }
    var vols = {};
    r.rows.forEach(function(x){ if(x.volume) vols[x.volume] = 1; });
    var maxPage = r.rows.reduce(function(a,b){ return Math.max(a, b.page_number); }, 0);

    out.innerHTML = '<div class="warn"><b>'+r.rows.length+' entries.</b>'
      + (Object.keys(vols).length ? '<br>Headings: '+esc(Object.keys(vols).join(", ")) : '')
      + '<br>Highest page referred to: '+maxPage
      + (r.bad ? '<br>'+r.bad+' lines could not be read and will be left out.' : '')
      + '</div>'
      + '<div class="scroller"><table><thead><tr><th>Heading</th><th>Entry</th><th>Page</th>'
      + '</tr></thead><tbody>'
      + r.rows.slice(0,8).map(function(x){
          return '<tr><td class="small">'+esc(x.volume||"\u2014")+'</td>'
            + '<td>'+esc(x.name)+'</td><td>'+x.page_number+'</td></tr>';
        }).join("")
      + '</tbody></table></div>'
      + (r.rows.length > 8 ? '<p class="hint">First 8 of '+r.rows.length+'.</p>' : '');
    $("toc_save").classList.remove("hidden");
  }

  function saveToc(){
    var r = parseToc($("toc_data").value);
    if(!r.rows.length) return;
    var b = $("toc_save"); b.disabled = true; b.textContent = "Saving\u2026";
    db.from("protocol_toc").delete().eq("set_id", TOC_SET).then(function(d){
      if(d.error) throw d.error;
      return db.from("protocol_toc").insert(r.rows);
    }).then(function(ins){
      b.disabled = false; b.textContent = "Save contents";
      if(ins.error) throw ins.error;
      toast("Saved " + r.rows.length + " entries");
      renderProtocols();
    }).catch(function(e){
      b.disabled = false; b.textContent = "Save contents";
      $("toc_out").innerHTML = '<div class="err">'+esc(e.message||"Could not save")+'</div>';
    });
  }

  /* ================= one click handler ================= */
  document.addEventListener("click", function(e){
    var t = e.target;
    if(!t || !t.closest) return;

    var ap = t.closest(".js-approve");
    if(ap){
      db.from("memberships").update({status:"active"}).eq("id", ap.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Approved"); renderMembers(); });
      return;
    }
    var su = t.closest(".js-suspend");
    if(su){
      if(!confirm("Suspend this member? They lose access immediately and all their devices are signed out.")) return;
      db.from("memberships").update({status:"suspended"}).eq("id", su.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Suspended"); renderMembers(); });
      return;
    }
    var rd = t.closest(".js-rdel");
    if(rd){
      if(!confirm("Remove unit " + rd.getAttribute("data-name") + " from the roster?")) return;
      db.from("roster_slots").delete().eq("id", rd.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Removed"); renderMembers(); });
      return;
    }
    var rj = t.closest(".js-reject");
    if(rj){
      if(!confirm("Remove this person's access?")) return;
      db.from("memberships").update({status:"removed"}).eq("id", rj.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Removed"); renderMembers(); });
      return;
    }

    var cd = t.closest(".js-cdel");
    if(cd){
      if(!confirm("Delete this row?")) return;
      db.from(CONTENT_SETS[CONTENT_SET].table).delete().eq("id", cd.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Deleted"); renderContent(); });
      return;
    }

    var td = t.closest(".js-tdel");
    if(td){
      if(!confirm("Remove the " + td.getAttribute("data-name") + " tile?")) return;
      db.from("tiles").delete().eq("id", td.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Removed"); renderTiles(); });
      return;
    }

    var hd = t.closest(".js-hdel");
    if(hd){
      if(!confirm("Delete " + hd.getAttribute("data-name") + "? This cannot be undone.")) return;
      db.from("hospitals").delete().eq("id", hd.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Deleted"); renderHospitals(); });
      return;
    }
    var ot = t.closest(".js-orgtog");
    if(ot){
      var on = ot.getAttribute("aria-pressed") !== "true";
      var patch = {}; patch[ot.getAttribute("data-f")] = on;
      db.from("orgs").update(patch).eq("id", orgId).then(function(r){
        if(r.error) return oops(r.error);
        ot.setAttribute("aria-pressed", on ? "true" : "false");
        org[ot.getAttribute("data-f")] = on;
        toast("Saved");
      });
      return;
    }
    var tc = t.closest(".js-toc");
    if(tc){ openToc(tc.getAttribute("data-id"), tc.getAttribute("data-name")); return; }
    if(t.id === "mi_go"){ importMembers(); return; }
    if(t.id === "md_go"){ uploadMedia(); return; }
    if(t.id === "toc_check"){ checkToc(); return; }
    if(t.id === "toc_save"){ saveToc(); return; }
    if(t.id === "toc_back"){ renderProtocols(); return; }

    var ps = t.closest(".js-pubset");
    if(ps){
      var on = ps.getAttribute("aria-pressed") !== "true";
      db.from("protocol_sets").update({is_published:on}).eq("id", ps.getAttribute("data-id"))
        .then(function(r){
          if(r.error) return oops(r.error);
          ps.setAttribute("aria-pressed", on ? "true" : "false");
          toast(on ? "Members can now see it" : "Hidden from members");
        });
      return;
    }
    var ds = t.closest(".js-delset");
    if(ds){
      if(!confirm("Delete \u201C" + ds.getAttribute("data-name")
          + "\u201D and all its pages? This cannot be undone.")) return;
      db.from("protocol_sets").delete().eq("id", ds.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Deleted"); renderProtocols(); });
      return;
    }

    if(t.id === "imp_preview"){ renderPreview(); return; }
    if(t.id === "imp_back"){ renderMapping(); return; }
    if(t.id === "imp_go"){ doImport(); return; }
    if(t.id === "imp_cancel"){ IMP = null; renderHospitals(); return; }

    var ft = t.closest(".js-feat");
    if(ft && !ft.disabled){
      var want = ft.getAttribute("aria-pressed") !== "true";
      db.from("org_features")
        .upsert({org_id:orgId, feature_key:ft.getAttribute("data-k"), enabled:want},
                {onConflict:"org_id,feature_key"})
        .then(function(r){
          if(r.error) return oops(r.error);
          ft.setAttribute("aria-pressed", want ? "true" : "false");
          toast(want ? "Switched on" : "Switched off");
        });
      return;
    }
  });

  /* tile edits */
  document.addEventListener("change", function(e){
    var el = e.target;
    if(el.classList && el.classList.contains("js-tsel")){
      db.from("tiles").update({ kind: el.value }).eq("id", el.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Saved"); renderTiles(); });
      return;
    }
    if(el.classList && el.classList.contains("js-rchk")){
      var rp = {}; rp[el.getAttribute("data-f")] = el.checked;
      db.from("roster_slots").update(rp).eq("id", el.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Saved"); });
      return;
    }
    if(el.classList && el.classList.contains("js-rsel")){
      var rs2 = {}; rs2[el.getAttribute("data-f")] = el.value;
      db.from("roster_slots").update(rs2).eq("id", el.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Saved"); });
      return;
    }
    if(el.classList && el.classList.contains("js-assign")){
      if(!el.value) return;
      db.rpc("assign_slot", { p_membership: el.getAttribute("data-m"), p_slot: el.value })
        .then(function(r){
          if(r.error) return oops(r.error);
          toast("Unit assigned"); renderMembers();
        }).catch(oops);
      return;
    }
    if(el.classList && el.classList.contains("js-cbool")){
      var cp = {}; cp[el.getAttribute("data-f")] = el.checked;
      db.from(CONTENT_SETS[CONTENT_SET].table).update(cp).eq("id", el.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Saved"); });
      return;
    }
    if(el.classList && el.classList.contains("js-disp")){
      db.from("memberships").update({ is_dispatcher: el.checked })
        .eq("id", el.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error);
                           toast(el.checked ? "Now a dispatcher" : "No longer a dispatcher"); });
      return;
    }
    if(el.classList && el.classList.contains("js-tchk")){
      var f = el.getAttribute("data-f");
      var patch = {};
      patch[f] = (f === "min_role") ? (el.checked ? "admin" : "member") : el.checked;
      db.from("tiles").update(patch).eq("id", el.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Saved"); });
      return;
    }
  });

  /* inline edits save on blur */
  document.addEventListener("blur", function(e){
    var i = e.target;
    if(i.classList && i.classList.contains("js-rs")){
      var rf = i.getAttribute("data-f"), rv = i.value.trim();
      var rp2 = {}; rp2[rf] = rv || null;
      db.from("roster_slots").update(rp2).eq("id", i.getAttribute("data-id"))
        .then(function(r){ if(r.error) oops(r.error); else toast("Saved"); });
      return;
    }
    if(i.classList && i.classList.contains("js-cin")){
      var set = CONTENT_SETS[CONTENT_SET];
      var cf = i.getAttribute("data-f"), cv = i.value.trim();
      var isNum = false;
      set.cols.forEach(function(c){ if(c.f === cf && c.num) isNum = true; });
      var cp = {};
      cp[cf] = isNum ? (parseFloat(cv) || 0) : (cv || null);
      db.from(set.table).update(cp).eq("id", i.getAttribute("data-id"))
        .then(function(r){ if(r.error) oops(r.error); else toast("Saved"); });
      return;
    }
    if(i.classList && i.classList.contains("js-duty")){
      db.from("memberships").update({ duty_status: i.value.trim() || null })
        .eq("id", i.getAttribute("data-id"))
        .then(function(r){ if(r.error) oops(r.error); else toast("Saved"); });
      return;
    }
    if(i.classList && i.classList.contains("js-t")){
      var tf = i.getAttribute("data-f"), tv = i.value.trim();
      var tp = {};
      tp[tf] = (tf === "sort_order") ? (parseFloat(tv) || 999) : (tv || null);
      db.from("tiles").update(tp).eq("id", i.getAttribute("data-id"))
        .then(function(r){ if(r.error) oops(r.error); else toast("Saved"); });
      return;
    }
    if(!i.classList || !i.classList.contains("js-h")) return;
    var f = i.getAttribute("data-f"), v = i.value.trim();
    var patch = {};
    if(f === "lat" || f === "lng"){
      if(v && isNaN(parseFloat(v))){ toast("Coordinates must be numbers."); return; }
      patch[f] = v ? parseFloat(v) : null;
    } else {
      patch[f] = v || null;
    }
    db.from("hospitals").update(patch).eq("id", i.getAttribute("data-id"))
      .then(function(r){ if(r.error) oops(r.error); else toast("Saved"); });
  }, true);

  document.addEventListener("change", function(e){
    var s = e.target;
    if(s.classList && s.classList.contains("js-map")){
      IMP.mapping[parseInt(s.getAttribute("data-i"), 10)] = s.value;
      renderMapping();
      return;
    }
    if(!s.classList || !s.classList.contains("js-role")) return;
    db.from("memberships").update({role:s.value}).eq("id", s.getAttribute("data-id"))
      .then(function(r){ if(r.error) return oops(r.error); toast("Role updated"); });
  });

  /* ================= new organization ================= */
  $("newOrgBtn").addEventListener("click", function(){
    var name = prompt("Organization name (e.g. Hatzalah of Lakewood)");
    if(!name) return;
    var code = prompt("Short code members will type (lowercase, e.g. lakewood)");
    if(!code) return;
    var email = prompt("Email address of the person who will run it");
    if(!email) return;
    var domain = prompt("Their email domain, or leave blank (e.g. hatzalahlakewood.org)") || null;

    db.rpc("new_org", {
      p_code: code.trim().toLowerCase(), p_name: name.trim(),
      p_contact_email: email.trim().toLowerCase(), p_domain: domain ? domain.trim().toLowerCase() : null
    }).then(function(r){
      if(r.error) return oops(r.error);
      toast("Created " + name);
      boot();
    }).catch(oops);
  });

  db.auth.getSession().then(function(r){
    if(r && r.data && r.data.session) boot();
  }).catch(function(){});
})();
</script>
</body>
</html>
