  /* ================= CERTIFICATIONS =================
     One grid: every member down the side, every certification across the
     top. Colour tells you the state at a glance, and the empty cells are
     the point - somebody who has submitted nothing is the person you most
     need to see. */

  var CERT_FILTER = "all", CERT_SEARCH = "", CERT_WHO = "member";

  function certState(exp, warnDays, type, held){
    if(type === "completion"){
      return (held && held.completed)
        ? { k:"ok", label:"done" }
        : { k:"missing", label:"\u2014" };
    }
    if(!exp) return { k:"missing", label:"\u2014" };
    var d = new Date(exp + "T00:00:00");
    var days = Math.round((d - new Date()) / 86400000);
    if(days < 0)  return { k:"expired",  label:exp, days:days };
    if(days <= (warnDays || 60)) return { k:"soon", label:exp, days:days };
    return { k:"ok", label:exp, days:days };
  }

  function renderCerts(){
    var el = $("member_body");
    el.innerHTML = '<div class="card"><div class="empty">Loading\u2026</div></div>';

    Promise.all([
      db.from("certification_types")
        .select("id,name,is_required,warn_days_before,sort_order,tracking")
        .eq("org_id", orgId).eq("is_active", true).order("sort_order"),
      db.from("roster_slots").select("id,unit_number,display_name,role,status")
        .eq("org_id", orgId).order("unit_number"),
      db.from("roster_certifications")
        .select("id,unit_number,cert_type_id,credential_number,expires_on,file_path,completed,completed_on")
        .eq("org_id", orgId),
      db.from("member_certifications")
        .select("id,user_id,cert_type_id,credential_number,expires_on,status,file_path,rejected_reason")
        .eq("org_id", orgId),
      db.from("memberships").select("user_id,unit_number,display_name").eq("org_id", orgId)
    ]).then(function(r){
      if(r[0].error) throw r[0].error;
      var types = r[0].data || [], roster = r[1].data || [],
          rcerts = r[2].data || [], mcerts = r[3].data || [], mems = r[4].data || [];

      if(!types.length){
        el.innerHTML = '<div class="card"><h2>Certifications</h2><div class="empty">'
          + 'No certifications set up yet. Add them under Content \u2192 Certification types.'
          + '</div></div>';
        return;
      }

      var unitOf = {};
      mems.forEach(function(m){ if(m.user_id) unitOf[m.user_id] = m.unit_number; });

      // what each unit holds, roster records first, then anything a signed-in
      // member has submitted since
      var held = {};
      rcerts.forEach(function(c){
        held[(c.unit_number||"").toLowerCase() + "|" + c.cert_type_id] = {
          expires_on:c.expires_on, credential_number:c.credential_number,
          file_path:c.file_path, completed:c.completed, completed_on:c.completed_on,
          source:"roster", id:c.id
        };
      });
      mcerts.forEach(function(c){
        var u = (unitOf[c.user_id] || "").toLowerCase();
        if(!u) return;
        held[u + "|" + c.cert_type_id] = {
          expires_on:c.expires_on, credential_number:c.credential_number,
          file_path:c.file_path, status:c.status, rejected_reason:c.rejected_reason,
          source:"member", id:c.id
        };
      });

      // counts for the filters
      var counts = { all:0, expired:0, soon:0, missing:0, pending:0 };
      roster.filter(function(p){ return CERT_WHO === "all" || p.role === CERT_WHO; })
        .forEach(function(p){
        types.forEach(function(t){
          var h = held[(p.unit_number||"").toLowerCase() + "|" + t.id];
          counts.all++;
          if(h && h.status === "pending"){ counts.pending++; return; }
          var st = certState(h && h.expires_on, t.warn_days_before, t.tracking, h);
          if(st.k === "expired") counts.expired++;
          else if(st.k === "soon") counts.soon++;
          else if(st.k === "missing" && t.is_required) counts.missing++;
        });
      });

      var whoCounts = { all: roster.length, member:0, dispatcher:0, admin:0 };
      roster.forEach(function(p){ whoCounts[p.role] = (whoCounts[p.role]||0) + 1; });

      var shown = roster.filter(function(p){
        if(CERT_WHO !== "all" && p.role !== CERT_WHO) return false;
        if(CERT_SEARCH){
          var hay = ((p.display_name||"") + " " + (p.unit_number||"")).toLowerCase();
          if(hay.indexOf(CERT_SEARCH.toLowerCase()) < 0) return false;
        }
        if(CERT_FILTER === "all") return true;
        return types.some(function(t){
          var h = held[(p.unit_number||"").toLowerCase() + "|" + t.id];
          if(CERT_FILTER === "pending") return h && h.status === "pending";
          var st = certState(h && h.expires_on, t.warn_days_before, t.tracking, h);
          if(CERT_FILTER === "missing") return st.k === "missing" && t.is_required;
          return st.k === CERT_FILTER;
        });
      });

      var html = '<div class="card" style="padding:14px 16px">'
        + '<div class="row" style="margin-bottom:10px">'
        +   '<span class="small" style="min-width:52px">Who</span>'
        +   [["member","Responders",whoCounts.member],
             ["dispatcher","Dispatchers",whoCounts.dispatcher],
             ["admin","Administrators",whoCounts.admin],
             ["all","Everyone",whoCounts.all]].map(function(w){
              return '<button class="btn js-cwho'+(CERT_WHO===w[0]?" primary":"")+'" '
                + 'data-w="'+w[0]+'"'+(w[2]?"":" disabled")+'>'
                + esc(w[1]) + ' <span class="small">'+w[2]+'</span></button>';
            }).join("")
        + '</div>'
        + '<div class="row" style="margin-bottom:10px">'
        +   '<span class="small" style="min-width:52px">Show</span>'
        + [["all","All of them",counts.all],["expired","Expired",counts.expired],
           ["soon","Expiring soon",counts.soon],["missing","Missing",counts.missing],
           ["pending","Awaiting review",counts.pending]].map(function(f){
            return '<button class="btn js-cfilter'+(CERT_FILTER===f[0]?" primary":"")+'" '
              + 'data-f="'+f[0]+'"'+(f[2]?"":" disabled")+'>'
              + esc(f[1]) + ' <span class="small">'+f[2]+'</span></button>';
          }).join("")
        + '</div><div class="row">'
        + '<span class="small" style="min-width:52px">Find</span>'
        + '<input id="csearch" placeholder="Name or unit" value="'+esc(CERT_SEARCH)+'" '
        + 'style="flex:1;min-width:170px;padding:9px 11px;border-radius:9px;border:1px solid var(--line)">'
        + '</div></div>';

      if(counts.pending){
        html += '<div class="warn"><b>'+counts.pending+' waiting for you to check.</b> '
             +  'A member changed a date or sent in a document.</div>';
      }

      html += '<div class="card"><h2>Certification grid</h2>'
        + '<p class="hint">Showing '+shown.length+' of '+roster.length+' people across '
        + types.length+' certifications. Click a date to change it.</p>'
        + '<div class="row" style="margin-bottom:12px">'
        +   '<span class="cellkey ok">in date</span>'
        +   '<span class="cellkey soon">expiring</span>'
        +   '<span class="cellkey expired">expired</span>'
        +   '<span class="cellkey missing">nothing on file</span>'
        +   '<span class="cellkey pending">awaiting review</span>'
        + '</div>';

      if(!shown.length){
        html += '<div class="empty">Nobody matches that.</div></div>';
        el.innerHTML = html; wireCerts(); return;
      }

      html += '<div class="scroller"><table class="certgrid"><thead><tr>'
        + '<th style="min-width:150px">Member</th>'
        + types.map(function(t){
            return '<th style="min-width:104px">'+esc(t.name)
              + (t.is_required ? '<span class="reqtag">REQUIRED</span>' : '') + '</th>';
          }).join("")
        + '</tr></thead><tbody>';

      shown.forEach(function(p){
        html += '<tr><td><b>'+esc(p.display_name || "\u2014")+'</b>'
          + '<div class="small">'+esc(p.unit_number || "")+'</div></td>'
          + types.map(function(t){
              var key = (p.unit_number||"").toLowerCase() + "|" + t.id;
              var h = held[key];
              var st = (h && h.status === "pending")
                ? { k:"pending", label:(h.expires_on || "sent in") }
                : certState(h && h.expires_on, t.warn_days_before, t.tracking, h);
              var title = h && h.credential_number ? h.credential_number : "";
              return '<td class="cell '+st.k+' js-cell" data-unit="'+esc(p.unit_number||"")+'" '
                + 'data-type="'+t.id+'" data-name="'+esc(t.name)+'" '
                + 'data-person="'+esc(p.display_name||"")+'" '
                + 'data-track="'+esc(t.tracking || "expiry")+'" '
                + 'data-done="'+((h && h.completed) ? "1" : "")+'" '
                + 'data-exp="'+esc(h && h.expires_on || "")+'" '
                + 'data-num="'+esc(h && h.credential_number || "")+'" '
                + 'data-file="'+esc(h && h.file_path || "")+'" '
                + 'data-status="'+esc(h && h.status || "")+'" '
                + 'data-mid="'+esc(h && h.source === "member" ? h.id : "")+'" '
                + (title ? 'title="'+esc(title)+'"' : '') + '>'
                + esc(st.label) + '</td>';
            }).join("")
          + '</tr>';
      });
      html += '</tbody></table></div></div>';

      el.innerHTML = html;
      wireCerts();
      wireDocUpload();
    }).catch(function(e){
      el.innerHTML = '<div class="card"><div class="err">'
        + esc(e.message || "Could not load certifications") + '</div></div>';
    });
  }

  function wireCerts(){
    Array.prototype.forEach.call(document.querySelectorAll(".js-cwho"), function(b){
      b.addEventListener("click", function(){
        CERT_WHO = b.getAttribute("data-w"); renderCerts();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".js-cfilter"), function(b){
      b.addEventListener("click", function(){
        CERT_FILTER = b.getAttribute("data-f"); renderCerts();
      });
    });
    var ce = $("cert_export");
    if(ce) ce.addEventListener("click", exportAllCerts);
    var cs = $("csearch");
    if(cs) cs.addEventListener("input", function(){
      clearTimeout(window.__cst);
      window.__cst = setTimeout(function(){
        CERT_SEARCH = cs.value; renderCerts();
        var again = $("csearch");
        if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      }, 260);
    });
  }

  function openCertCell(td){
    var unit = td.getAttribute("data-unit"), typeId = td.getAttribute("data-type");
    var file = td.getAttribute("data-file"), status = td.getAttribute("data-status");
    var mid  = td.getAttribute("data-mid");

    var body = '<h2>'+esc(td.getAttribute("data-name"))+'</h2>'
      + '<p class="hint">'+esc(td.getAttribute("data-person"))+' \u00B7 '+esc(unit)+'</p>'
      + '<div class="grid2">'
      +   '<div class="f"><label>Expires</label>'
      +     '<input id="cc_exp" type="date" value="'+esc(td.getAttribute("data-exp"))+'"></div>'
      +   '<div class="f"><label>Number</label>'
      +     '<input id="cc_num" value="'+esc(td.getAttribute("data-num"))+'"></div>'
      + '</div>'
      + '<div class="row" style="margin-bottom:12px">'
      +   (file ? '<button id="cc_view" class="btn">View the document</button>' : '')
      +   '<label class="btn" style="cursor:pointer">' + (file ? "Replace it" : "Attach a document")
      +     '<input type="file" id="cc_file" accept="image/*,application/pdf" style="display:none">'
      +   '</label>'
      + '</div>'
      + (file ? '' : '<p class="hint">Nothing on file for this one yet.</p>')
      + (status === "pending"
          ? '<div class="warn">This was changed by the member and is waiting for you.</div>'
            + '<div class="row"><button id="cc_ok" class="btn ok">Approve</button>'
            + '<button id="cc_no" class="btn danger">Reject</button></div>'
          : '')
      + '<div class="row" style="margin-top:14px">'
      +   '<button id="cc_save" class="btn primary">Save</button>'
      +   '<button id="cc_clear" class="btn danger">Clear this one</button>'
      +   '<button id="cc_cancel" class="btn">Cancel</button></div>';

    var scrim = document.createElement("div");
    scrim.className = "scrim"; scrim.id = "certScrim";
    scrim.innerHTML = '<div class="sheet">' + body + '</div>';
    document.body.appendChild(scrim);

    function close(){ scrim.remove(); }
    scrim.addEventListener("click", function(e){ if(e.target === scrim) close(); });
    $("cc_cancel").addEventListener("click", close);

    if($("cc_view")) $("cc_view").addEventListener("click", function(){
      db.storage.from("member-docs").createSignedUrl(file, 300).then(function(r){
        if(r.error || !r.data) return oops(r.error || new Error("Could not open it."));
        window.open(r.data.signedUrl, "_blank", "noopener");
      }).catch(oops);
    });

    function saveRoster(patch){
      return db.from("roster_certifications").upsert(
        Object.assign({ org_id:orgId, unit_number:unit, cert_type_id:typeId }, patch),
        { onConflict:"org_id,unit_number,cert_type_id" });
    }

    if($("cc_file")) $("cc_file").addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      if(f.size > 10 * 1024 * 1024){ toast("That file is larger than 10 MB."); return; }
      var clean = f.name.toLowerCase().replace(/[^a-z0-9._-]+/g, "-");
      var path = orgId + "/certs/unit-" + String(unit).toLowerCase() + "/"
               + Date.now().toString(36) + "-" + clean;
      toast("Uploading\u2026");
      db.storage.from("member-docs")
        .upload(path, f, { upsert:true, contentType:f.type || "application/octet-stream" })
        .then(function(r){
          if(r.error) throw r.error;
          return saveRoster({ file_path: path });
        })
        .then(function(r){
          if(r.error) throw r.error;
          close(); toast("Document attached"); renderCerts();
        }).catch(oops);
    });

    $("cc_save").addEventListener("click", function(){
      var num = $("cc_num").value.trim() || null;
      var patch;
      if($("cc_done")){
        patch = { completed: $("cc_done").checked,
                  completed_on: $("cc_done").checked ? new Date().toISOString().slice(0,10) : null,
                  credential_number: num };
      } else {
        patch = { expires_on: $("cc_exp").value || null, credential_number: num };
      }
      var exp = patch.expires_on || null;
      saveRoster(patch).then(function(r){
        if(r.error) throw r.error;
        if(mid){
          var mp = { credential_number:num, status:"verified",
                     verified_at:new Date().toISOString() };
          if(patch.expires_on !== undefined) mp.expires_on = patch.expires_on;
          if(patch.completed  !== undefined){ mp.completed = patch.completed;
                                              mp.completed_on = patch.completed_on; }
          return db.from("member_certifications").update(mp).eq("id", mid);
        }
      }).then(function(){ close(); toast("Saved"); renderCerts(); }).catch(oops);
    });

    $("cc_clear").addEventListener("click", function(){
      if(!confirm("Remove this certification record?")) return;
      db.from("roster_certifications").delete()
        .eq("org_id", orgId).eq("unit_number", unit).eq("cert_type_id", typeId)
        .then(function(){
          if(mid) return db.from("member_certifications").delete().eq("id", mid);
        }).then(function(){ close(); toast("Removed"); renderCerts(); }).catch(oops);
    });

    if($("cc_ok")) $("cc_ok").addEventListener("click", function(){
      db.rpc("review_certification", { p_cert:mid, p_approve:true })
        .then(function(r){ if(r.error) return oops(r.error);
                           close(); toast("Approved"); renderCerts(); }).catch(oops);
    });
    if($("cc_no")) $("cc_no").addEventListener("click", function(){
      var why = prompt("Why are you rejecting it? The member will see this.");
      if(why === null) return;
      db.rpc("review_certification", { p_cert:mid, p_approve:false, p_reason:why })
        .then(function(r){ if(r.error) return oops(r.error);
                           close(); toast("Rejected"); renderCerts(); }).catch(oops);
    });
  }

  /* ---------- putting many scanned documents on file at once ----------
     Twenty-four people with fourteen certificates each is 336 documents.
     Nobody is opening each person and attaching them one at a time. Drop
     the whole folder in; the file names say who and what. */

  var DOC_QUEUE = null, DOC_MATCHES = null;

  function renderDocUpload(){
    return '<div class="card"><h2>Upload many documents at once</h2>'
      + '<p class="hint">Select a whole folder of scanned certificates. Each file is matched '
      + 'to a person and a certification by its <b>name</b>, so name them like this:</p>'
      + '<pre class="mono" style="background:#F4F6FA;padding:11px;border-radius:9px;'
      +   'white-space:pre-wrap;margin:0 0 12px">H-44 drivers license.pdf\n'
      +   'H-2_NREMT.jpg\n'
      +   'D-218 American Heart BLS.pdf</pre>'
      + '<p class="hint">The unit number comes first, then the certification. Punctuation and '
      + 'capitals do not matter. Anything it cannot place is listed so you can rename and try '
      + 'again \u2014 nothing is uploaded until you have seen the matches.</p>'
      + '<div class="f"><input id="doc_files" type="file" multiple '
      +   'accept="image/*,application/pdf"></div>'
      + '<div id="doc_out"></div></div>';
  }

  function wireDocUpload(){
    var f = $("doc_files");
    if(!f) return;
    f.addEventListener("change", function(e){
      DOC_QUEUE = Array.prototype.slice.call(e.target.files || []);
      if(!DOC_QUEUE.length) return;
      matchDocs();
    });
  }

  /* "H-44 drivers license.pdf" has to find "Driver's License". Apostrophes,
     slashes and plurals are how people actually name files. */
  function normWord(x){
    return String(x || "").toLowerCase()
      .replace(/['’]/g, "")          // driver's -> drivers
      .replace(/[^a-z0-9]+/g, " ")
      .replace(/\b(\w+)s\b/g, "$1")      // licenses -> license
      .trim();
  }

  function matchDocs(){
    var out = $("doc_out");
    out.innerHTML = '<div class="empty">Matching\u2026</div>';

    Promise.all([
      db.from("people").select("unit_number,first_name,last_name")
        .eq("org_id", orgId).not("unit_number", "is", null),
      db.from("certification_types").select("id,name")
        .eq("org_id", orgId).eq("is_active", true).order("sort_order")
    ]).then(function(r){
      var people = r[0].data || [], types = r[1].data || [];
      var matched = [], unmatched = [];

      DOC_QUEUE.forEach(function(file){
        var base = normWord(file.name.replace(/\.[a-z0-9]+$/i, ""));

        // the unit is whichever unit number appears in the name
        var person = null;
        people.forEach(function(p){
          var u = normWord(p.unit_number);
          if(!u) return;
          if((" " + base + " ").indexOf(" " + u + " ") > -1){
            if(!person || u.length > normWord(person.unit_number).length) person = p;
          }
        });

        // the certification is the longest type name that appears in it
        var type = null;
        types.forEach(function(t){
          var n = normWord(t.name);
          if(n && base.indexOf(n) > -1){
            if(!type || n.length > normWord(type.name).length) type = t;
          }
        });

        if(person && type) matched.push({ file:file, person:person, type:type });
        else unmatched.push({ file:file,
              why: !person ? "no unit number found" : "no certification name found" });
      });

      DOC_MATCHES = matched;

      var html = '';
      if(matched.length){
        html += '<div class="warn"><b>'+matched.length+' ready to upload.</b>'
             +  (unmatched.length ? '<br>'+unmatched.length+' could not be placed.' : '')
             +  '</div>'
             + '<div class="scroller tall"><table><thead><tr><th>File</th><th>Person</th>'
             + '<th>Certification</th></tr></thead><tbody>'
             + matched.map(function(m){
                 return '<tr><td class="small">'+esc(m.file.name)+'</td>'
                   + '<td>'+esc(m.person.unit_number)+' \u00B7 '
                   + esc(((m.person.first_name||"")+" "+(m.person.last_name||"")).trim())+'</td>'
                   + '<td>'+esc(m.type.name)+'</td></tr>';
               }).join("")
             + '</tbody></table></div>'
             + '<div class="row" style="margin-top:12px">'
             + '<button id="doc_go" class="btn primary">Upload '+matched.length+' documents</button>'
             + '</div>'
             + '<div id="doc_progress" class="hidden" style="margin-top:12px">'
             +   '<div class="bar-outer"><div id="doc_bar" class="bar-inner"></div></div>'
             +   '<div id="doc_status" class="mono">\u2014</div></div>';
      }
      if(unmatched.length){
        html += '<div class="card" style="margin-top:12px;border-color:#F0BEC0">'
             + '<h2>Could not be placed</h2>'
             + '<p class="hint">Rename these so the unit number and the certification both '
             + 'appear, then choose them again.</p>'
             + '<div class="scroller narrow"><table><thead><tr><th>File</th><th>Why</th>'
             + '</tr></thead><tbody>'
             + unmatched.map(function(u){
                 return '<tr><td class="small">'+esc(u.file.name)+'</td>'
                   + '<td class="small">'+esc(u.why)+'</td></tr>';
               }).join("")
             + '</tbody></table></div></div>';
      }
      out.innerHTML = html || '<div class="err">Nothing could be matched.</div>';

      if($("doc_go")) $("doc_go").addEventListener("click", uploadDocs);
    }).catch(function(e){
      out.innerHTML = '<div class="err">'+esc(e.message||"Could not match")+'</div>';
    });
  }

  function uploadDocs(){
    if(!DOC_MATCHES || !DOC_MATCHES.length) return;
    var go = $("doc_go"); go.disabled = true;
    $("doc_progress").classList.remove("hidden");

    var done = 0, failed = [], total = DOC_MATCHES.length;

    function step(i){
      if(i >= total){
        go.disabled = false;
        $("doc_status").textContent = done + " uploaded"
          + (failed.length ? ", " + failed.length + " failed" : "");
        $("doc_out").innerHTML = (failed.length
            ? '<div class="err">These failed:<br>' + failed.map(esc).join("<br>") + '</div>'
            : '<div class="warn">All ' + done + ' documents are on file.</div>')
          + renderDocUpload();
        wireDocUpload();
        DOC_QUEUE = null; DOC_MATCHES = null;
        return;
      }

      var m = DOC_MATCHES[i];
      $("doc_bar").style.width = Math.round(i/total*100) + "%";
      $("doc_status").textContent = (i+1) + " of " + total + " \u00B7 " + m.file.name;

      var clean = m.file.name.toLowerCase().replace(/[^a-z0-9._-]+/g, "-");
      var path = orgId + "/certs/unit-" + normWord(m.person.unit_number).replace(/ /g,"-")
               + "/" + Date.now().toString(36) + "-" + clean;

      db.storage.from("member-docs")
        .upload(path, m.file, { upsert:true,
                                contentType:m.file.type || "application/octet-stream" })
        .then(function(r){
          if(r.error) throw r.error;
          return db.from("roster_certifications").upsert({
            org_id: orgId, unit_number: m.person.unit_number,
            cert_type_id: m.type.id, file_path: path
          }, { onConflict:"org_id,unit_number,cert_type_id" });
        })
        .then(function(r){
          if(r.error) throw r.error;
          done++; step(i+1);
        })
        .catch(function(err){
          failed.push(m.file.name + " (" + ((err && err.message) || "failed") + ")");
          step(i+1);
        });
    }
    step(0);
  }

  /* ---------- everything about one person, in one zip ----------
     When an auditor asks for a responder's file, nobody should be clicking
     through fourteen certifications downloading them one at a time. This
     collects the summary and every document into a single zip. */

  function exportPerson(p, types, have){
    var btn = $("pp_export"), out = $("pp_expout");
    btn.disabled = true; btn.textContent = "Collecting\u2026";

    var name = ((p.first_name||"") + " " + (p.last_name||"")).trim() || "person";
    var safe = name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
    var today = new Date().toISOString().slice(0,10);
    var zip = new JSZip();
    var folder = zip.folder(safe + "-" + (p.unit_number || "no-unit"));

    // 1. a readable summary
    var lines = [];
    lines.push("CERTIFICATION FILE");
    lines.push("Produced " + today);
    lines.push("");
    lines.push("Name          " + name);
    lines.push("Unit          " + (p.unit_number || "-"));
    lines.push("Badge         " + (p.badge_number || "-"));
    lines.push("Type          " + (p.entry_type || "-"));
    lines.push("Level         " + (p.level || "-"));
    lines.push("Role          " + (p.role || "-"));
    lines.push("Badges        " + ((p.badges||[]).join(", ") || "-"));
    lines.push("Duty          " + (p.duty_status || "-"));
    lines.push("Email         " + (p.email || "-"));
    lines.push("Phone         " + (p.phone || "-"));
    lines.push("Status        " + (p.status || "-"));
    lines.push("");
    lines.push("CERTIFICATIONS");
    lines.push("");

    var csv = [["Certification","Tracked as","Required","Expires","Completed",
                "Number","State","Document"]];

    types.forEach(function(t){
      var h = have[t.id];
      var st = certState(h && h.expires_on, t.warn_days_before, t.tracking, h);
      var stateWord = { ok:"in date", soon:"expiring soon", expired:"EXPIRED",
                        missing:"nothing on file" }[st.k] || st.k;
      var docName = "";
      if(h && h.file_path) docName = String(h.file_path).split("/").pop();

      var label = t.name;
      while(label.length < 30) label += " ";
      lines.push("  " + label
        + (t.tracking === "completion"
            ? ((h && h.completed) ? "completed " + (h.completed_on || "") : "NOT COMPLETED")
            : ((h && h.expires_on) ? "expires " + h.expires_on : "nothing on file"))
        + (t.is_required ? "   [required]" : "")
        + (docName ? "   -> " + docName : ""));

      csv.push([t.name,
                t.tracking === "completion" ? "done or not done" : "expires on a date",
                t.is_required ? "yes" : "no",
                (h && h.expires_on) || "",
                (h && h.completed) ? ((h.completed_on) || "yes") : "",
                (h && h.credential_number) || "",
                stateWord, docName]);
    });

    lines.push("");
    lines.push("Documents are in the documents folder alongside this file.");
    folder.file("summary.txt", lines.join("\n"));
    folder.file("certifications.csv", csv.map(function(r){
      return r.map(function(c){
        c = String(c == null ? "" : c);
        return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
      }).join(",");
    }).join("\r\n"));

    // 2. every document, fetched one at a time
    var docs = types.filter(function(t){ return have[t.id] && have[t.id].file_path; });
    var got = 0, failed = [];

    function next(i){
      if(i >= docs.length) return finish();
      var t = docs[i], path = have[t.id].file_path;
      out.textContent = "Document " + (i+1) + " of " + docs.length + "\u2026";
      db.storage.from("member-docs").createSignedUrl(path, 300).then(function(r){
        if(r.error || !r.data) throw new Error("no link");
        return fetch(r.data.signedUrl);
      }).then(function(res){
        if(!res.ok) throw new Error("could not fetch");
        return res.blob();
      }).then(function(blob){
        var ext = (String(path).split(".").pop() || "pdf").toLowerCase();
        var clean = t.name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        folder.folder("documents").file(clean + "." + ext, blob);
        got++;
        next(i+1);
      }).catch(function(){
        failed.push(t.name);
        next(i+1);
      });
    }

    function finish(){
      if(failed.length){
        folder.file("missing-documents.txt",
          "These had a document on file that could not be downloaded:\n\n"
          + failed.join("\n"));
      }
      out.textContent = "Building the zip\u2026";
      zip.generateAsync({ type:"blob" }).then(function(blob){
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = safe + "-file-" + today + ".zip";
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
        btn.disabled = false; btn.textContent = "Download their whole file";
        out.textContent = got + " document" + (got===1?"":"s") + " included"
          + (failed.length ? ", " + failed.length + " could not be fetched" : "");
      }).catch(function(e){
        btn.disabled = false; btn.textContent = "Download their whole file";
        out.textContent = "Could not build the zip: " + ((e && e.message) || "");
      });
    }

    next(0);
  }

  /* ---------- the whole roster, for a wider audit ---------- */
  function exportAllCerts(){
    var btn = $("cert_export");
    btn.disabled = true; btn.textContent = "Collecting\u2026";

    Promise.all([
      db.from("people").select("*").eq("org_id", orgId).order("unit_number"),
      db.from("certification_types").select("*")
        .eq("org_id", orgId).eq("is_active", true).order("sort_order"),
      db.from("roster_certifications").select("*").eq("org_id", orgId)
    ]).then(function(r){
      var people = r[0].data || [], types = r[1].data || [], certs = r[2].data || [];
      var held = {};
      certs.forEach(function(c){
        held[(c.unit_number||"").toLowerCase() + "|" + c.cert_type_id] = c;
      });

      var head = ["Unit","Name","Type","Level","Role","Duty","Status"];
      types.forEach(function(t){ head.push(t.name); head.push(t.name + " number"); });
      var rows = [head];

      people.forEach(function(p){
        var line = [p.unit_number || "",
                    ((p.first_name||"") + " " + (p.last_name||"")).trim(),
                    p.entry_type || "", p.level || "", p.role || "",
                    p.duty_status || "", p.status || ""];
        types.forEach(function(t){
          var h = held[(p.unit_number||"").toLowerCase() + "|" + t.id];
          if(t.tracking === "completion"){
            line.push(h && h.completed ? ("completed " + (h.completed_on||"")) : "");
          } else {
            line.push((h && h.expires_on) || "");
          }
          line.push((h && h.credential_number) || "");
        });
        rows.push(line);
      });

      var csv = rows.map(function(rr){
        return rr.map(function(c){
          c = String(c == null ? "" : c);
          return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
        }).join(",");
      }).join("\r\n");

      var blob = new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8;" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "certifications-" + new Date().toISOString().slice(0,10) + ".csv";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
      btn.disabled = false; btn.textContent = "Download the whole grid";
      toast("Downloaded " + people.length + " people");
    }).catch(function(e){
      btn.disabled = false; btn.textContent = "Download the whole grid";
      oops(e);
    });
  }

  function wireCabinets(cabs){
    Array.prototype.forEach.call(document.querySelectorAll(".js-cab"), function(b){
      b.addEventListener("click", function(){
        CAB_ID = b.getAttribute("data-id"); renderCabinets();
      });
    });

    var nb = $("cab_new");
    if(nb) nb.addEventListener("click", function(){
      var name = prompt("What is this cabinet called?", "New cabinet");
      if(!name) return;
      db.from("cabinets").insert({ org_id:orgId, name:name.trim(),
                                   sort_order:(cabs.length+1)*10 })
        .select().single().then(function(r){
          if(r.error) return oops(r.error);
          CAB_ID = r.data.id; toast("Added"); renderCabinets();
        }).catch(oops);
    });

    Array.prototype.forEach.call(document.querySelectorAll(".js-cabdel"), function(b){
      b.addEventListener("click", function(ev){
        ev.stopPropagation();
        if(!confirm("Delete this cabinet and every bin on it?")) return;
        var id = b.getAttribute("data-id");
        db.from("cabinets").delete().eq("id", id).then(function(r){
          if(r.error) return oops(r.error);
          if(CAB_ID === id) CAB_ID = null;
          toast("Deleted"); renderCabinets();
        }).catch(oops);
      });
    });

    var ph = $("cab_photo");
    if(ph) ph.addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      if(f.size > 8 * 1024 * 1024){ toast("Keep the photo under 8 MB."); return; }
      var path = orgId + "/cabinets/" + CAB_ID + "-" + Date.now().toString(36) + "-"
               + f.name.toLowerCase().replace(/[^a-z0-9._-]+/g, "-");
      toast("Uploading\u2026");
      db.storage.from("org-branding").upload(path, f, { upsert:true, contentType:f.type })
        .then(function(r){
          if(r.error) throw r.error;
          var url = db.storage.from("org-branding").getPublicUrl(path).data.publicUrl;
          return db.from("cabinets").update({ photo_path:url }).eq("id", CAB_ID);
        })
        .then(function(r){
          if(r.error) throw r.error;
          toast("Photo saved"); renderCabinets();
        }).catch(oops);
    });
  }

  /* drag a rectangle over the photo to make a new bin */
  function wireBinDrawing(){
    var wrap = $("binwrap"), layer = $("binlayer");
    if(!wrap || wrap.__wired) return;
    wrap.__wired = true;

    var start = null, ghost = null;

    function pos(e){
      var r = wrap.getBoundingClientRect();
      return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
               y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
    }

    wrap.addEventListener("mousedown", function(e){
      if(e.target.closest && e.target.closest(".js-bin")) return;
      e.preventDefault();
      start = pos(e);
      ghost = document.createElement("div");
      ghost.className = "binbox ghost";
      layer.appendChild(ghost);
    });

    wrap.addEventListener("mousemove", function(e){
      if(!start || !ghost) return;
      var p = pos(e);
      var x = Math.min(start.x, p.x), y = Math.min(start.y, p.y);
      var w = Math.abs(p.x - start.x), h = Math.abs(p.y - start.y);
      ghost.style.left = (x*100)+"%"; ghost.style.top = (y*100)+"%";
      ghost.style.width = (w*100)+"%"; ghost.style.height = (h*100)+"%";
    });

    window.addEventListener("mouseup", function(e){
      if(!start || !ghost) return;
      var p = pos(e);
      var x = Math.min(start.x, p.x), y = Math.min(start.y, p.y);
      var w = Math.abs(p.x - start.x), h = Math.abs(p.y - start.y);
      ghost.remove(); ghost = null; start = null;

      if(w < 0.02 || h < 0.02) return;      // a stray click, not a box

      var name = prompt("What is in this bin?");
      if(!name){ return; }
      db.from("cabinet_items").insert({
        org_id: orgId, cabinet_id: CAB_ID, name: name.trim(),
        x: +x.toFixed(5), y: +y.toFixed(5), w: +w.toFixed(5), h: +h.toFixed(5)
      }).then(function(r){
        if(r.error) return oops(r.error);
        toast("Bin added"); loadBins();
      }).catch(oops);
    });
  }

  function saveSettings(){
    var b = $("s_save"); b.disabled = true;
    var code = $("s_code").value.trim().toLowerCase();
    if(!/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(code)){
      b.disabled = false;
      toast("Code must be lowercase letters, numbers and dashes only.");
      return;
    }
    var dom = $("s_domain").value.trim().toLowerCase().replace(/^@/,"");
    db.from("orgs").update({
      code: code,
      name: $("s_name").value.trim(),
      app_name: $("s_appname").value.trim() || null,
      brand_primary: $("s_brand").value,
      login_subtext: $("s_sub").value.trim() || null,
      dispatch_phone: $("s_dispatch").value.trim() || null,
      medical_control_phone: $("s_medcon").value.trim() || null,
      upload_url: $("s_upload").value.trim() || null,
      maps_api_key: $("s_mapkey").value.trim() || null,
      email_domains: dom ? [dom] : [],
      auth_mode: $("s_auth").value
    }).eq("id", orgId).select().then(function(r){
      b.disabled = false;
      if(r.error) return oops(r.error);
      if(r.data && r.data[0]){
        for(var i=0;i<orgs.length;i++){ if(orgs[i].id===orgId) orgs[i]=r.data[0]; }
        org = r.data[0];
      }
      $("orgPick").innerHTML = orgs.map(function(o){
        return '<option value="'+o.id+'">'+esc(o.name)+' ('+esc(o.code)+')</option>';
      }).join("");
      $("orgPick").value = orgId;
      toast("Saved");
    }).catch(function(e){ b.disabled = false; oops(e); });
  }

  var BRAND_LOGO_PREVIEW = null;

  function wireAppearance(){
    ["s_brand","s_onbrand","s_appname","s_sub"].forEach(function(id){
      var el = $(id);
      if(el) el.addEventListener("input", function(){
        if(id === "s_brand" && $("s_brandpick")) $("s_brandpick").value = el.value;
        if(id === "s_onbrand" && $("s_onbrandpick")) $("s_onbrandpick").value = el.value;
        paintBrandPreview();
      });
    });
    [["s_brandpick","s_brand"],["s_onbrandpick","s_onbrand"]].forEach(function(pair){
      var pick = $(pair[0]);
      if(pick) pick.addEventListener("input", function(){
        $(pair[1]).value = pick.value; paintBrandPreview();
      });
    });

    var lf = $("s_logofile");
    if(lf) lf.addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      if(f.size > 2 * 1024 * 1024){ toast("Keep the logo under 2 MB."); return; }
      var reader = new FileReader();
      reader.onload = function(ev){ BRAND_LOGO_PREVIEW = ev.target.result; paintBrandPreview(); };
      reader.readAsDataURL(f);

      var path = orgId + "/brand/logo-" + Date.now().toString(36) + "-"
               + f.name.toLowerCase().replace(/[^a-z0-9._-]+/g, "-");
      toast("Uploading the logo\u2026");
      db.storage.from("org-branding").upload(path, f, { upsert:true, contentType:f.type })
        .then(function(r){
          if(r.error) throw r.error;
          var url = db.storage.from("org-branding").getPublicUrl(path).data.publicUrl;
          return db.from("orgs").update({ logo_path: url }).eq("id", orgId);
        })
        .then(function(r){
          if(r.error) throw r.error;
          toast("Logo saved"); org.logo_path = null; renderSettings();
        }).catch(oops);
    });

    var lc = $("s_logoclear");
    if(lc) lc.addEventListener("click", function(){
      if(!confirm("Remove the logo?")) return;
      db.from("orgs").update({ logo_path: null }).eq("id", orgId).then(function(r){
        if(r.error) return oops(r.error);
        BRAND_LOGO_PREVIEW = null; toast("Logo removed"); renderSettings();
      }).catch(oops);
    });

    /* One square PNG, resized to the two sizes a phone wants for its
       home screen. Nobody should have to produce both by hand. */
    var icf = $("s_iconfile");
    if(icf) icf.addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      var img = new Image();
      img.onload = function(){
        var sizes = [[192, "icon_192_path"], [512, "icon_512_path"]];
        var patch = {}, jobs = [];
        sizes.forEach(function(sz){
          var c = document.createElement("canvas");
          c.width = c.height = sz[0];
          var ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0, sz[0], sz[0]);
          jobs.push(new Promise(function(res, rej){
            c.toBlob(function(blob){
              if(!blob) return rej(new Error("Could not resize the icon."));
              var path = orgId + "/brand/icon-" + sz[0] + "-" + Date.now().toString(36) + ".png";
              db.storage.from("org-branding")
                .upload(path, blob, { upsert:true, contentType:"image/png" })
                .then(function(r){
                  if(r.error) return rej(r.error);
                  patch[sz[1]] = db.storage.from("org-branding")
                    .getPublicUrl(path).data.publicUrl;
                  res();
                }).catch(rej);
            }, "image/png");
          }));
        });
        toast("Making both icon sizes\u2026");
        Promise.all(jobs).then(function(){
          return db.from("orgs").update(patch).eq("id", orgId);
        }).then(function(r){
          if(r.error) throw r.error;
          toast("Icons saved"); renderSettings();
        }).catch(oops);
      };
      img.onerror = function(){ toast("That image could not be read."); };
      img.src = URL.createObjectURL(f);
    });

    paintBrandPreview();
  }

  /* ================= one click handler ================= */
  document.addEventListener("click", function(e){
    var t = e.target;
    if(!t || !t.closest) return;

    var ap = t.closest(".js-approve");
    if(ap){
      db.from("memberships").update({status:"active"}).eq("id", ap.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Approved"); renderMembers(); });
      return;
    }
    var su = t.closest(".js-suspend");
    if(su){
      if(!confirm("Suspend this member? They lose access immediately and all their devices are signed out.")) return;
      db.from("memberships").update({status:"suspended"}).eq("id", su.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Suspended"); renderMembers(); });
      return;
    }
    var pr = t.closest(".js-person");
    if(pr){
      if(t.classList && t.classList.contains("draghandle")) return;
      openPerson(pr.getAttribute("data-id"));
      return;
    }

    var cell = t.closest(".js-cell");
    if(cell){ openCertCell(cell); return; }

    var bc = t.closest(".js-badge");
    if(bc){
      var bid = bc.getAttribute("data-id"), bname = bc.getAttribute("data-b");
      db.from("roster_slots").select("badges").eq("id", bid).maybeSingle().then(function(g){
        var list = (g.data && g.data.badges) || [];
        var at = list.indexOf(bname);
        if(at > -1) list.splice(at, 1); else list.push(bname);
        return db.from("roster_slots").update({ badges:list }).eq("id", bid);
      }).then(function(r){
        if(r && r.error) return oops(r.error);
        bc.classList.toggle("on");
        toast("Saved");
      }).catch(oops);
      return;
    }

    var rd = t.closest(".js-rdel");
    if(rd){
      if(!confirm("Remove unit " + rd.getAttribute("data-name") + " from the roster?")) return;
      db.from("roster_slots").delete().eq("id", rd.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Removed"); renderMembers(); });
      return;
    }
    var rj = t.closest(".js-reject");
    if(rj){
      if(!confirm("Remove this person's access?")) return;
      db.from("memberships").update({status:"removed"}).eq("id", rj.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Removed"); renderMembers(); });
      return;
    }

    var cid = t.closest(".js-cidel");
    if(cid){
      if(!confirm("Delete this item?")) return;
      db.from("checklist_items").delete().eq("id", cid.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error);
                           toast("Deleted"); renderChecklist(); });
      return;
    }

    var ctd = t.closest(".js-ctdel");
    if(ctd){
      if(!confirm("Delete " + ctd.getAttribute("data-name")
          + "? Every record of it goes too.")) return;
      db.from("certification_types").delete().eq("id", ctd.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error);
                           toast("Deleted"); renderCertTypes(); });
      return;
    }

    var cd = t.closest(".js-cdel");
    if(cd){
      if(!confirm("Delete this row?")) return;
      db.from(CONTENT_SETS[CONTENT_SET].table).delete().eq("id", cd.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Deleted"); renderContent(); });
      return;
    }

    var td = t.closest(".js-tdel");
    if(td){
      if(!confirm("Remove the " + td.getAttribute("data-name") + " tile?")) return;
      db.from("tiles").delete().eq("id", td.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Removed"); renderTiles(); });
      return;
    }

    var hd = t.closest(".js-hdel");
    if(hd){
      if(!confirm("Delete " + hd.getAttribute("data-name") + "? This cannot be undone.")) return;
      db.from("hospitals").delete().eq("id", hd.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Deleted"); renderHospitals(); });
      return;
    }
    var ot = t.closest(".js-orgtog");
    if(ot){
      var on = ot.getAttribute("aria-pressed") !== "true";
      var patch = {}; patch[ot.getAttribute("data-f")] = on;
      db.from("orgs").update(patch).eq("id", orgId).then(function(r){
        if(r.error) return oops(r.error);
        ot.setAttribute("aria-pressed", on ? "true" : "false");
        org[ot.getAttribute("data-f")] = on;
        toast("Saved");
      });
      return;

    var tc = t.closest(".js-toc");
    if(tc){ openToc(tc.getAttribute("data-id"), tc.getAttribute("data-name")); return; }
    if(t.id === "mi_go"){ importMembers(); return; }
    if(t.id === "md_go"){ uploadMedia(); return; }
    if(t.id === "toc_check"){ checkToc(); return; }
    if(t.id === "toc_save"){ saveToc(); return; }
    if(t.id === "toc_back"){ renderProtocols(); return; }

    var ps = t.closest(".js-pubset");
    if(ps){
      var on = ps.getAttribute("aria-pressed") !== "true";
      db.from("protocol_sets").update({is_published:on}).eq("id", ps.getAttribute("data-id"))
        .then(function(r){

    if(t.id === "imp_go"){ doImport(); return; }
    if(t.id === "imp_cancel"){ IMP = null; renderHospitals(); return; }

    var ft = t.closest(".js-feat");
    if(ft && !ft.disabled){
      var want = ft.getAttribute("aria-pressed") !== "true";
      db.from("org_features")
        .upsert({org_id:orgId, feature_key:ft.getAttribute("data-k"), enabled:want},

        .then(function(r){

          ft.setAttribute("aria-pressed", want ? "true" : "false");
          toast(want ? "Switched on" : "Switched off");
        });

    if(el.classList && el.classList.contains("js-rsel")){
      var rs2 = {}; rs2[el.getAttribute("data-f")] = el.value;
      db.from("roster_slots").update(rs2).eq("id", el.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Saved"); });
      return;
    }
    if(el.classList && el.classList.contains("js-assign")){
      if(!el.value) return;
      db.rpc("assign_slot", { p_membership: el.getAttribute("data-m"), p_slot: el.value })
        .then(function(r){
          if(r.error) return oops(r.error);
          toast("Unit assigned"); renderMembers();
        }).catch(oops);
      return;
    }
    if(el.classList && el.classList.contains("js-cichk")){
      markEdit("checklist_items", el.getAttribute("data-id"),
               el.getAttribute("data-f"), el.checked);
      return;
    }
    if(el.classList && el.classList.contains("js-ctsel")){
      markEdit("certification_types", el.getAttribute("data-id"),
               el.getAttribute("data-f"), el.value);
      return;
    }
    if(el.classList && el.classList.contains("js-ctchk")){
      markEdit("certification_types", el.getAttribute("data-id"),
               el.getAttribute("data-f"), el.checked);
      return;
    }
    if(el.classList && el.classList.contains("js-cbool")){
      markEdit(CONTENT_SETS[CONTENT_SET].table, el.getAttribute("data-id"),
               el.getAttribute("data-f"), el.checked);
      return;
    }
    if(el.classList && el.classList.contains("js-disp")){
      db.from("memberships").update({ is_dispatcher: el.checked })
        .eq("id", el.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error);
                           toast(el.checked ? "Now a dispatcher" : "No longer a dispatcher"); });
      return;
    }
    if(el.classList && el.classList.contains("js-tchk")){
      var f = el.getAttribute("data-f");
      var patch = {};
      patch[f] = (f === "min_role") ? (el.checked ? "admin" : "member") : el.checked;
      db.from("tiles").update(patch).eq("id", el.getAttribute("data-id"))
        .then(function(r){ if(r.error) return oops(r.error); toast("Saved"); });
      return;
    }
  });

  /* inline edits save on blur */
  document.addEventListener("blur", function(e){
    var i = e.target;
    if(i.classList && i.classList.contains("js-rs")){
      var rf = i.getAttribute("data-f"), rv = i.value.trim();
      var rp2 = {}; rp2[rf] = rv || null;
      db.from("roster_slots").update(rp2).eq("id", i.getAttribute("data-id"))
        .then(function(r){ if(r.error) oops(r.error); else toast("Saved"); });
      return;
    }
    if(i.classList && i.classList.contains("js-cabf")){
      markEdit("cabinets", i.getAttribute("data-id"),
               i.getAttribute("data-f"), i.value.trim() || null);
      i.classList.add("edited");
      return;
    }
    if(i.classList && i.classList.contains("js-binf")){
      markEdit("cabinet_items", i.getAttribute("data-bid"),
               i.getAttribute("data-f"), i.value.trim() || null);
      i.classList.add("edited");
      return;
    }
    if(i.classList && i.classList.contains("js-ci")){
      var cif = i.getAttribute("data-f"), civ = i.value.trim();
      var val;
      if(cif === "quantity") val = civ === "" ? null : parseFloat(civ);
      else if(cif === "tiers") val = civ ? civ.split(",").map(function(x){
        return x.trim().toUpperCase(); }).filter(Boolean) : [];
      else val = civ || null;
      markEdit("checklist_items", i.getAttribute("data-id"), cif, val);
      i.classList.add("edited");
      return;
    }
    if(i.classList && i.classList.contains("js-ct")){
      var ctf = i.getAttribute("data-f"), ctv = i.value.trim();
      var num = (ctf === "sort_order" || ctf === "validity_months" || ctf === "warn_days_before");
      markEdit("certification_types", i.getAttribute("data-id"), ctf,
               num ? (ctv === "" ? null : parseFloat(ctv)) : (ctv || null));
      i.classList.add("edited");
      return;
    }
    if(i.classList && i.classList.contains("js-cin")){
      var set = CONTENT_SETS[CONTENT_SET];
      var cf = i.getAttribute("data-f"), cv = i.value.trim();
      var isNum = false;
      set.cols.forEach(function(c){ if(c.f === cf && c.num) isNum = true; });
      markEdit(set.table, i.getAttribute("data-id"), cf,
               isNum ? (parseFloat(cv) || 0) : (cv || null));
      i.classList.add("edited");
      return;
    }
    if(i.classList && i.classList.contains("js-duty")){
      db.from("memberships").update({ duty_status: i.value.trim() || null })
        .eq("id", i.getAttribute("data-id"))
        .then(function(r){ if(r.error) oops(r.error); else toast("Saved"); });
      return;
    }
    if(i.classList && i.classList.contains("js-t")){
      var tf = i.getAttribute("data-f"), tv = i.value.trim();
      markEdit("tiles", i.getAttribute("data-id"), tf,
               (tf === "sort_order") ? (parseFloat(tv) || 999) : (tv || null));
      i.classList.add("edited");
      return;
    }
    if(!i.classList || !i.classList.contains("js-h")) return;
    var f = i.getAttribute("data-f"), v = i.value.trim();
    var val;
    if(f === "lat" || f === "lng"){
      if(v && isNaN(parseFloat(v))){ toast("Coordinates must be numbers."); return; }
      val = v ? parseFloat(v) : null;
    } else {
      val = v || null;
    }
    markEdit("hospitals", i.getAttribute("data-id"), f, val);
    i.classList.add("edited");
  }, true);

  document.addEventListener("change", function(e){
    var s = e.target;
    if(s.classList && s.classList.contains("js-map")){
      IMP.mapping[parseInt(s.getAttribute("data-i"), 10)] = s.value;
      renderMapping();
      return;
    }
    if(!s.classList || !s.classList.contains("js-role")) return;
    db.from("memberships").update({role:s.value}).eq("id", s.getAttribute("data-id"))
      .then(function(r){ if(r.error) return oops(r.error); toast("Role updated"); });
  });

  /* ================= new organization =================
     This has to do the whole job. Creating the organization alone leaves
     one nobody can get into, because the head has no administrator place
     waiting for them. */

  $("newOrgBtn").addEventListener("click", openNewOrg);

  /* When the page and the database disagree about who you are, this says
     which one is wrong. The page decides what to show from your profile;
     the database decides what to allow from the same row, read as you. */
  $("whoBtn").addEventListener("click", function(){
    db.rpc("whoami").then(function(r){
      var w = (r.data && r.data.length) ? r.data[0] : null;
      var scrim = document.createElement("div");
      scrim.className = "scrim";
      scrim.innerHTML = '<div class="sheet">'
        + '<h2 style="margin:0 0 10px">What the database sees</h2>'
        + (r.error
            ? '<div class="err">' + esc(r.error.message) + '</div>'
              + '<p class="hint">If it says the function does not exist, file 26 has not been '
              + 'run yet.</p>'
            : (!w || !w.signed_in_as
                ? '<div class="err">No signed-in account. Sign out and sign in again.</div>'
                : '<div class="srow"><label>Signed in as</label><div class="val">'
                  + esc(w.email || "(no email on the profile)") + '</div></div>'
                  + '<div class="srow"><label>Super-admin</label><div class="val">'
                  + (w.is_super_admin
                      ? '<span class="pill active">yes</span>'
                      : '<span class="pill pending">no</span>') + '</div></div>'
                  + '<div class="srow"><label>Organizations</label><div class="val">'
                  + (w.org_count || 0) + '</div></div>'
                  + '<div class="srow"><label>Administrator of</label><div class="val">'
                  + esc(w.admin_of || "\u2014") + '</div></div>'
                  + (w.is_super_admin
                      ? '<p class="hint">You can create organizations.</p>'
                      : '<div class="warn">This account is not marked as a super-admin, so it '
                        + 'cannot create organizations. Run file 26 step 2 with '
                        + '<b>' + esc(w.email || "your email") + '</b>.</div>')))
        + '<div class="row" style="margin-top:14px">'
        + '<button id="who_close" class="btn primary">Close</button></div></div>';
      document.body.appendChild(scrim);
      scrim.addEventListener("click", function(e){ if(e.target === scrim) scrim.remove(); });
      $("who_close").addEventListener("click", function(){ scrim.remove(); });
    }).catch(oops);
  });

  function openNewOrg(){
    var scrim = document.createElement("div");
    scrim.className = "scrim"; scrim.id = "newOrgScrim";
    scrim.innerHTML = '<div class="sheet wide">'
      + '<h2 style="margin:0 0 4px">Set up a new organization</h2>'
      + '<p class="hint">They get their own login page, their own people, their own '
      + 'everything. They will not be able to see this organization, or you theirs.</p>'
      + '<div class="grid2">'
      +   '<div class="f"><label>Organization name</label>'
      +     '<input id="no_name" placeholder="Their organization name"></div>'
      +   '<div class="f"><label>Code members will type</label>'
      +     '<input id="no_code" placeholder="A short lowercase word"></div>'
      +   '<div class="f"><label>Their email domain</label>'
      +     '<input id="no_domain" placeholder="Their email domain"></div>'
      +   '<div class="f"><label>Name of the person who will run it</label>'
      +     '<input id="no_headname" placeholder="Their full name"></div>'
      +   '<div class="f" style="grid-column:1/-1"><label>Their email address'
      +     ' <span class="small">this is how they sign in</span></label>'
      +     '<input id="no_heademail" placeholder="Their email address"></div>'
      + '</div>'
      + '<div id="no_err"></div>'
      + '<div class="row" style="margin-top:14px">'
      +   '<button id="no_go" class="btn primary">Create it</button>'
      +   '<button id="no_cancel" class="btn">Cancel</button>'
      + '</div></div>';
    document.body.appendChild(scrim);

    scrim.addEventListener("click", function(e){ if(e.target === scrim) scrim.remove(); });
    $("no_cancel").addEventListener("click", function(){ scrim.remove(); });

    /* the code and domain can nearly always be worked out from the name */
    $("no_name").addEventListener("blur", function(){
      var n = $("no_name").value.trim();
      if(n && !$("no_code").value.trim()){
        var last = n.split(/\s+/).pop().toLowerCase().replace(/[^a-z0-9]/g, "");
        $("no_code").value = last;
      }
    });
    $("no_heademail").addEventListener("blur", function(){
      var e = $("no_heademail").value.trim();
      if(e.indexOf("@") > -1 && !$("no_domain").value.trim()){
        $("no_domain").value = e.split("@")[1].toLowerCase();
      }
    });

    $("no_go").addEventListener("click", function(){
      var name = $("no_name").value.trim(),
          code = $("no_code").value.trim().toLowerCase(),
          domain = $("no_domain").value.trim().toLowerCase(),
          headName = $("no_headname").value.trim(),
          headEmail = $("no_heademail").value.trim().toLowerCase();

      var err = $("no_err");
      err.innerHTML = "";
      if(!name || !code || !headEmail){
        err.innerHTML = '<div class="err">A name, a code and the head\u2019s email are needed.</div>';
        return;
      }
      if(!/^[a-z0-9-]+$/.test(code)){
        err.innerHTML = '<div class="err">The code can only be lowercase letters, numbers '
          + 'and dashes.</div>';
        return;
      }
      if(headEmail.indexOf("@") < 1){
        err.innerHTML = '<div class="err">That email address does not look right.</div>';
        return;
      }

      var btn = $("no_go"); btn.disabled = true; btn.textContent = "Creating\u2026";
      db.rpc("onboard_org", {
        p_code: code, p_name: name, p_domain: domain || headEmail.split("@")[1],
        p_head_email: headEmail, p_head_name: headName || null
      }).then(function(r){
        btn.disabled = false; btn.textContent = "Create it";
        if(r.error) return oops(r.error);
        scrim.remove();
        showHandover(name, code, headEmail, headName);
        boot();
      }).catch(function(e){
        btn.disabled = false; btn.textContent = "Create it";
        oops(e);
      });
    });
  }

  /* The organization exists, but they still need a login and to be told
     three things. Saying so is the difference between this working and
     you wondering why they cannot get in. */
  function showHandover(name, code, headEmail, headName){
    var appUrl = location.origin + location.pathname.replace(/admin\.html$/, "");
    var scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML = '<div class="sheet wide">'
      + '<h2 style="margin:0 0 4px">' + esc(name) + ' is set up</h2>'
      + '<p class="hint">Two things left, and they are both quick.</p>'

      + '<div class="steps">'
      +   '<div class="step"><span class="n">1</span><div><b>Create their login</b>'
      +     '<div class="small">In Supabase: Authentication \u2192 Users \u2192 Add user. '
      +     'Use <b>' + esc(headEmail) + '</b>, set a password, turn Auto Confirm on.</div>'
      +   '</div></div>'
      +   '<div class="step"><span class="n">2</span><div><b>Send them this</b>'
      +     '<div class="small">Then they sign in and take over.</div></div></div>'
      + '</div>'

      + '<div class="f"><label>Message to send</label>'
      +   '<textarea id="ho_msg" rows="8" style="width:100%;padding:11px;border-radius:9px;'
      +   'border:1px solid var(--line);font:inherit">'
      +   esc("Hi " + (headName || "there") + ",\n\n"
          + "Your organization is set up.\n\n"
          + "Address: " + appUrl + "\n"
          + "Organization code: " + code + "\n"
          + "Sign in with: " + headEmail + "\n"
          + "Password: (the one I set for you, sent separately)\n\n"
          + "Once you are in, the admin page is at " + appUrl + "admin.html\n"
          + "You can add your people, hospitals, protocols and equipment there.\n\n"
          + "Nobody outside your organization can see any of it.")
      +   '</textarea></div>'

      + '<div class="row"><button id="ho_copy" class="btn primary">Copy the message</button>'
      +   '<button id="ho_close" class="btn">Done</button></div></div>';
    document.body.appendChild(scrim);

    $("ho_close").addEventListener("click", function(){ scrim.remove(); });
    $("ho_copy").addEventListener("click", function(){
      var t = $("ho_msg");
      t.select();
      try{ document.execCommand("copy"); toast("Copied"); }
      catch(e){ toast("Select the text and copy it."); }
    });
  }

  db.auth.getSession().then(function(r){
    if(r && r.data && r.data.session) boot();
  }).catch(function(){});
})();
</script>
</body>
</html>
