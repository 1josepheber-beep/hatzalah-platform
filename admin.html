<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Hatzalah Platform</title>
<style>
  :root{
    --brand:#143D75; --brand-deep:#0D2A52; --ink:#12161C; --muted:#5C6675;
    --line:#DFE4EC; --bg:#F4F6FA; --card:#fff; --red:#B3121B; --green:#1B7F3B;
    --amber:#8A6A1A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .hidden{display:none !important}
  button,input,select,textarea{font:inherit}
  :focus-visible{outline:2px solid #7FA8E0;outline-offset:2px}

  /* sign in */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:var(--brand);padding:24px}
  #login .box{width:100%;max-width:380px;color:#fff}
  #login h1{font-size:23px;margin:0 0 4px;font-weight:650}
  #login p{margin:0 0 24px;opacity:.7}
  .f{margin-bottom:13px}
  .f label{display:block;font-size:13px;margin-bottom:5px;opacity:.8}
  .f textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .f input,.f select,.f textarea{width:100%;padding:11px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink);font-size:15px}
  #login .f input{border-color:rgba(255,255,255,.25);background:rgba(0,0,0,.22);color:#fff}
  .btn{padding:11px 16px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-weight:600;cursor:pointer}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.danger{background:#FDECEC;border-color:#F0BEC0;color:var(--red)}
  .btn.ok{background:#EAF4EC;border-color:#B9DCC4;color:var(--green)}
  .btn:disabled{opacity:.5;cursor:default}
  #login .btn{width:100%;background:#fff;color:var(--brand);border:0;padding:13px}
  .err{background:#FDECEC;border:1px solid #F0BEC0;color:var(--red);
    padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:13px}
  #login .err{background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.3);color:#FFDDDF}

  /* chrome */
  header{background:var(--brand);color:#fff;padding:12px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:150px}
  header select{padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.22);color:#fff;font-size:14px;max-width:230px}
  header .btn{background:rgba(255,255,255,.14);border:0;color:#fff;padding:7px 12px;font-size:14px}
  nav{background:var(--brand-deep);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  nav button{background:none;border:0;color:rgba(255,255,255,.72);padding:12px 14px;
    font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
    border-bottom:3px solid transparent}
  nav button[aria-current="true"]{color:#fff;border-bottom-color:#fff;font-weight:650}
  main{padding:18px;max-width:1000px;margin:0 auto}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
    background:#12161C;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.25)}

  /* content */
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 3px;font-size:16px}
  .card .hint{margin:0 0 14px;color:var(--muted);font-size:13.5px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
  /* A four-column table has no business scrolling sideways. */
  .scroller.narrow table{min-width:0}
  .scroller.narrow{overflow-x:visible}
  /* When a table IS wide, keep it in its own box so the sideways scrollbar
     is beside the rows instead of at the bottom of the whole page. */
  .scroller.tall{max-height:70vh;overflow:auto}
  table input{width:100%;min-width:0;padding:8px 9px;border-radius:7px;
    border:1px solid var(--line);font-size:13.5px}
  td.actions{width:1%;white-space:nowrap;text-align:right}
  .xbtn{width:32px;height:32px;padding:0;border-radius:8px;background:#FDECEC;
    border:1px solid #F0BEC0;color:var(--red);font-size:16px;line-height:1;font-weight:700}
  .coords{display:flex;gap:5px;min-width:186px}
  .coords input{width:88px;flex:none}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);padding:8px 9px;border-bottom:2px solid var(--line)}
  td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:5px}
  .pill.pending{background:#FFF3D4;color:var(--amber)}
  .pill.active{background:#EAF4EC;color:var(--green)}
  .pill.suspended{background:#FDECEC;color:var(--red)}
  .pill.admin{background:#EAF0F9;color:#28456F}
  .small{font-size:13px;color:var(--muted)}
  /* a count sitting inside a selected button has to be legible on it */
  .btn.primary .small,
  .btn.primary .small *{color:rgba(255,255,255,.85)}
  .btn .small{margin-left:5px;font-weight:600}
  .warn{background:#FFF8E6;border:1px solid #E8CE86;color:#6B520C;
    padding:10px 12px;border-radius:9px;font-size:13.5px;margin-bottom:13px}
  .empty{text-align:center;color:var(--muted);padding:30px}
  tr.chosen td{background:#EEF3FB}
  .binwrap{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);
    border-radius:10px;overflow:hidden;cursor:crosshair;user-select:none}
  .binwrap img{display:block;max-width:100%;height:auto;pointer-events:none}
  #binlayer{position:absolute;inset:0}
  .binbox{position:absolute;border:2px solid var(--brand);background:rgba(20,61,117,.16);
    border-radius:4px;cursor:pointer;display:flex;align-items:flex-end;overflow:hidden}
  .binbox span{font-size:10px;font-weight:700;background:var(--brand);color:#fff;
    padding:1px 4px;border-radius:0 4px 0 0;white-space:nowrap}
  .binbox.ghost{border-style:dashed;background:rgba(20,61,117,.08);pointer-events:none}
  .binbox:hover{background:rgba(20,61,117,.3)}
  .brandgrid{display:grid;grid-template-columns:1fr 300px;gap:22px}
  @media (max-width:920px){ .brandgrid{grid-template-columns:1fr} }
  .phone{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;
    box-shadow:0 6px 22px rgba(16,24,40,.09)}
  .phone-top{height:46px}
  .phone-body{padding:20px 18px 24px;text-align:center}
  .phone-logo{width:74px;height:74px;object-fit:contain;margin:-46px auto 12px;display:block;
    background:#fff;border-radius:16px;padding:7px;box-shadow:0 2px 10px rgba(16,24,40,.14)}
  .phone-logo.placeholder{display:flex;align-items:center;justify-content:center;
    font-size:10.5px;color:#9AA4B2;border:1px dashed var(--line);box-shadow:none}
  .phone-title{font-weight:800;font-size:16px;color:var(--ink)}
  .phone-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .phone-field{margin-top:11px;border:1px solid var(--line);border-radius:9px;padding:10px;
    font-size:12.5px;color:#9AA4B2;text-align:left}
  .phone-btn{margin-top:13px;border-radius:9px;padding:11px;font-weight:700;font-size:13.5px}
  .phone-link{margin-top:11px;font-size:12px}
  .savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:70;
    background:#12161C;color:#fff;padding:11px 14px;border-radius:12px;display:flex;
    align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);font-size:14px}
  .savebar .btn{padding:8px 14px;font-size:13.5px}
  input.edited,select.edited{border-color:#C9A227;background:#FFFCF2}
  tr.dragging{opacity:.4}
  tr.dragover td{box-shadow:inset 0 2px 0 var(--brand)}
  .draghandle{cursor:grab;color:#9AA4B2;font-size:16px;user-select:none}
  .badgepick{display:flex;flex-wrap:wrap;gap:4px}
  /* Scrolling right must not lose the name of the person you are reading.
     The first column and the header row both stay put. */
  .certgrid{border-collapse:separate;border-spacing:0}
  .certgrid thead th{position:sticky;top:0;z-index:3;background:#fff;
    box-shadow:inset 0 -2px 0 var(--line)}
  .certgrid tbody td:first-child,
  .certgrid thead th:first-child{position:sticky;left:0;z-index:2;background:#fff;
    box-shadow:inset -1px 0 0 var(--line)}
  .certgrid thead th:first-child{z-index:4}
  .certgrid tbody tr:hover td:first-child{background:#F7F9FC}
  .certgrid td.cell{text-align:center;font-size:12.5px;cursor:pointer;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .scroller.tall{max-height:70vh;overflow:auto}
  /* a sticky bottom edge means the sideways scrollbar is always in view */
  .scroller.tall::-webkit-scrollbar{height:12px;width:12px}
  .scroller.tall::-webkit-scrollbar-thumb{background:#B9C2CF;border-radius:8px}
  .scroller.tall::-webkit-scrollbar-track{background:#EEF1F5}
  .reqtag{display:block;font-size:10px;font-weight:700;letter-spacing:.04em;
    color:#93151C;margin-top:2px}
  .certgrid td.cell:hover{outline:2px solid var(--brand);outline-offset:-2px}
  .cell.ok{background:#EAF4EC;color:#146030}
  .cell.soon{background:#FFF3D4;color:#8A6A1A;font-weight:650}
  .cell.expired{background:#FDECEC;color:#93151C;font-weight:700}
  .cell.missing{background:#F4F6FA;color:#9AA4B2}
  .cell.pending{background:#EAF0F9;color:#28456F;font-weight:650}
  .cellkey{font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:6px}
  .cellkey.ok{background:#EAF4EC;color:#146030}
  .cellkey.soon{background:#FFF3D4;color:#8A6A1A}
  .cellkey.expired{background:#FDECEC;color:#93151C}
  .cellkey.missing{background:#F4F6FA;color:#9AA4B2}
  .cellkey.pending{background:#EAF0F9;color:#28456F}
  .scrim{position:fixed;inset:0;background:rgba(10,16,26,.5);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .sheet{background:#fff;border-radius:14px;padding:20px;max-width:520px;width:100%;
    max-height:88vh;overflow:auto}
  .sheet.wide{max-width:820px}
  tr.js-person:hover td{background:#F7F9FC}
  .bchip{font-size:11px;font-weight:650;padding:4px 8px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
  .bchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .bar-outer{height:9px;background:#E3E8F0;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar-inner{height:100%;background:var(--green);width:0;transition:width .2s}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted)}
  .steps{display:flex;flex-direction:column;gap:14px;margin-bottom:4px}
  .step{display:flex;gap:12px;align-items:flex-start}
  .step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700}
  .linklike{background:none;border:0;color:var(--brand);text-decoration:underline;
    padding:0;cursor:pointer;font-size:13px}
  .maprow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--line)}
  .maprow:last-of-type{border-bottom:0}
  .maprow .arrow{color:var(--muted)}
  .maprow .yours{font-weight:600;word-break:break-word}
  .maprow .sample{font-size:12px;color:var(--muted);font-weight:400}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 0;border-bottom:1px solid var(--line)}
  .switch:last-child{border-bottom:0}
  .switch b{font-weight:600;font-size:14.5px}
  .toggle{width:48px;height:27px;border-radius:99px;border:0;background:#CBD2DD;
    position:relative;cursor:pointer;flex:none}
  .toggle[aria-pressed="true"]{background:var(--green)}
  .toggle span{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
    background:#fff;transition:transform .16s}
  .toggle[aria-pressed="true"] span{transform:translateX(21px)}
  .toggle:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>

<section id="login">
  <div class="box">
    <h1>Platform Admin</h1>
    <p>Sign in to manage organizations</p>
    <div id="loginErr" class="err hidden"></div>
    <div class="f"><label for="email">Email</label>
      <input id="email" type="email" autocomplete="username"></div>
    <div class="f"><label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn">Sign in</button>
    <button id="resetBtn" class="btn" style="margin-top:8px;background:#fff;color:var(--brand);border:1px solid var(--line)">Email me a link to set a password</button>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <h1>Admin</h1>
    <select id="orgPick"></select>
    <button id="whoBtn" class="btn">Check my account</button>
  <button id="newOrgBtn" class="btn hidden">New organization</button>
    <button id="signout" class="btn">Sign out</button>
  </header>
  <nav>
    <button data-tab="members"   aria-current="true">Members</button>
    <button data-tab="hospitals">Hospitals</button>
    <button data-tab="protocols">Protocols</button>
    <button data-tab="tiles">Home screen</button>
    <button data-tab="equipment">Equipment</button>
    <button data-tab="content">Content</button>
    <button data-tab="media">Images</button>
    <button data-tab="settings">Organization</button>
    <button data-tab="features">Features</button>
  </nav>
  <main>
    <div id="tab-members"></div>
    <div id="tab-hospitals" class="hidden"></div>
    <div id="tab-protocols" class="hidden"></div>
    <div id="tab-tiles" class="hidden"></div>
    <div id="tab-equipment" class="hidden"></div>
    <div id="tab-content" class="hidden"></div>
    <div id="tab-media" class="hidden"></div>
    <div id="tab-settings" class="hidden"></div>
    <div id="tab-features" class="hidden"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://fwjxskdgzzfgqhnabrpa.supabase.co";
  var SUPABASE_KEY = "sb_publishable_vbsCkIpZsk7bh-PjbhIYSw__t9MtXJi";

  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var $  = function(id){ return document.getElementById(id); };

  var isSuper = false, orgs = [], orgId = null, org = null;
  var ROSTER_FILTER = "all", ROSTER_SEARCH = "";

  /* Nothing saves until you say so. Edits collect here and the bar at the
     bottom tells you how many are waiting. Moving something by accident is
     easy; losing work because it saved itself is worse. */
  var PENDING = {};      // "table|id" -> { table, id, patch }

  function pendingCount(){ return Object.keys(PENDING).length; }

  function markEdit(table, id, field, value){
    var key = table + "|" + id;
    if(!PENDING[key]) PENDING[key] = { table:table, id:id, patch:{} };
    PENDING[key].patch[field] = value;
    paintSaveBar();
  }

  function discardEdits(){
    PENDING = {};
    paintSaveBar();
    render();
  }

  function paintSaveBar(){
    var bar = $("saveBar");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "saveBar"; bar.className = "savebar hidden";
      bar.innerHTML = '<span id="saveCount"></span>'
        + '<button id="saveDiscard" class="btn">Discard</button>'
        + '<button id="saveGo" class="btn primary">Save changes</button>';
      document.body.appendChild(bar);
      $("saveDiscard").addEventListener("click", function(){
        if(confirm("Throw away your unsaved changes?")) discardEdits();
      });
      $("saveGo").addEventListener("click", saveEdits);
    }
    var n = pendingCount();
    bar.classList.toggle("hidden", n === 0);
    if(n) $("saveCount").textContent = n + (n === 1 ? " unsaved change" : " unsaved changes");
  }

  function saveEdits(){
    var jobs = Object.keys(PENDING).map(function(k){
      var e = PENDING[k];
      return db.from(e.table).update(e.patch).eq("id", e.id);
    });
    if(!jobs.length) return;
    var btn = $("saveGo"); btn.disabled = true; btn.textContent = "Saving\u2026";
    Promise.all(jobs).then(function(rs){
      btn.disabled = false; btn.textContent = "Save changes";
      var bad = rs.filter(function(r){ return r && r.error; });
      if(bad.length) return oops(bad[0].error);
      var n = pendingCount();
      PENDING = {}; paintSaveBar();
      toast("Saved " + n + (n === 1 ? " change" : " changes"));
      render();
    }).catch(function(e){
      btn.disabled = false; btn.textContent = "Save changes";
      oops(e);
    });
  }

  /* leaving with work unsaved should take a deliberate click */
  window.addEventListener("beforeunload", function(e){
    if(pendingCount()){ e.preventDefault(); e.returnValue = ""; }
  });
  var TABS = ["members","hospitals","protocols","tiles","equipment","content","media","settings","features"];

  /* Remember where you were. Refreshing in the middle of data entry and
     landing back on the first tab is maddening. */
  function readState(){
    var h = (location.hash || "").replace(/^#/,"");
    var parts = {};
    h.split("&").forEach(function(kv){
      var p = kv.split("=");
      if(p[0]) parts[p[0]] = decodeURIComponent(p[1] || "");
    });
    return parts;
  }
  function writeState(){
    var h = "tab=" + tab + (orgId ? "&org=" + orgId : "");
    /* Opening the file straight from disk, or an unusual browser, can refuse
       this. Remembering where you were is a convenience and must never be
       allowed to stop the page rendering. */
    try{
      if(location.hash.replace(/^#/,"") !== h){
        history.replaceState(null, "", "#" + h);
      }
    }catch(e){}
    try{ localStorage.setItem("hzadmin_state", JSON.stringify({tab:tab, org:orgId})); }catch(e){}
  }
  function savedState(){
    var st = readState();
    if(!st.tab || !st.org){
      try{
        var ls = JSON.parse(localStorage.getItem("hzadmin_state") || "{}");
        st.tab = st.tab || ls.tab; st.org = st.org || ls.org;
      }catch(e){}
    }
    return st;
  }

  var tab = (function(){
    var t = savedState().tab;
    return TABS.indexOf(t) > -1 ? t : "members";
  })();

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function toast(msg){
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }
  function oops(e){ toast(e && e.message ? e.message : "Something went wrong"); }

  /* ---------------- sign in ---------------- */
  $("loginBtn").addEventListener("click", function(){
    var b = $("loginBtn");
    $("loginErr").classList.add("hidden");
    b.disabled = true; b.textContent = "Signing in\u2026";
    db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value })
      .then(function(r){
        b.disabled = false; b.textContent = "Sign in";
        if(r.error){ $("loginErr").innerHTML = explainSignIn(r.error.message, $("email").value.trim());
                     $("loginErr").classList.remove("hidden"); return; }
        boot();
      }).catch(function(){
        b.disabled = false; b.textContent = "Sign in";
        $("loginErr").textContent = "Could not reach the server.";
        $("loginErr").classList.remove("hidden");
      });
  });
  $("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") $("loginBtn").click(); });

  /* Supabase's messages are short and say nothing about what to do. These
     are the three reasons a new organization's head cannot get in. */
  function explainSignIn(msg, email){
    var m = String(msg || "").toLowerCase();
    if(m.indexOf("not confirmed") > -1){
      return "This account has not been confirmed. In Supabase, open "
        + "Authentication \u2192 Users, click " + esc(email) + ", and confirm it \u2014 "
        + "or turn on Auto Confirm when creating the login.";
    }
    if(m.indexOf("invalid login") > -1){
      return "That email and password do not match an account.<br><br>"
        + "The three usual reasons: the login was never created in Supabase under "
        + "Authentication \u2192 Users; the address differs from the one there; or the "
        + "password has a space on the end from copying it. Use the button below to set "
        + "a fresh password by email.";
    }
    if(m.indexOf("rate") > -1 || m.indexOf("many") > -1){
      return "Too many attempts. Wait a minute and try again.";
    }
    return esc(msg || "Sign-in failed.");
  }

  $("resetBtn").addEventListener("click", function(){
    var em = $("email").value.trim();
    if(!em || em.indexOf("@") < 1){
      $("loginErr").textContent = "Type the email address first, then press this.";
      $("loginErr").classList.remove("hidden");
      return;
    }
    var b = $("resetBtn"); b.disabled = true; b.textContent = "Sending\u2026";
    db.auth.resetPasswordForEmail(em, { redirectTo: location.href }).then(function(r){
      b.disabled = false; b.textContent = "Email me a link to set a password";
      $("loginErr").classList.remove("hidden");
      $("loginErr").textContent = r && r.error
        ? r.error.message
        : "If that address has an account, a link is on its way. It sets a new password.";
    }).catch(function(){
      b.disabled = false; b.textContent = "Email me a link to set a password";
      $("loginErr").textContent = "Could not reach the server.";
      $("loginErr").classList.remove("hidden");
    });
  });
  $("signout").addEventListener("click", function(){
    db.auth.signOut().then(function(){ location.reload(); });
  });

  /* ---------------- boot ---------------- */
  function boot(){
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");

    db.auth.getUser().then(function(u){
      var uid = u && u.data && u.data.user ? u.data.user.id : null;
      /* Someone set up as an administrator has a person record waiting but
         no membership until they first sign in. Claim it before asking what
         they can see, or their own organization is invisible to them. */
      /* Supabase's builder is not a full promise, so it has no .catch of its
         own. Wrapping it gives one, and a failure here must never stop
         sign-in - the claim is a convenience, not a requirement. */
      return Promise.resolve(db.rpc("claim_my_place"))
        .then(function(){ return null; }, function(){ return null; })
        .then(function(){
          return db.from("profiles").select("is_super_admin").eq("id", uid).maybeSingle();
        });
    }).then(function(r){
      isSuper = !!(r.data && r.data.is_super_admin);
      $("newOrgBtn").classList.toggle("hidden", !isSuper);
      return db.from("orgs").select("*").order("name");
    }).then(function(r){
      orgs = r.data || [];
      if(!orgs.length){
        $("tab-members").innerHTML = '<div class="card"><div class="empty">'
          + 'You are not an administrator of any organization.</div></div>';
        return;
      }
      $("orgPick").innerHTML = orgs.map(function(o){
        return '<option value="'+o.id+'">'+esc(o.name)+' ('+esc(o.code)+')</option>';
      }).join("");
      var want = savedState().org;
      var found = null;
      for(var i=0;i<orgs.length;i++){ if(orgs[i].id === want) found = orgs[i].id; }
      showTab(tab);
      selectOrg(found || orgs[0].id);
    }).catch(oops);
  }

  function selectOrg(id){
    orgId = id;
    for(var i=0;i<orgs.length;i++){ if(orgs[i].id === id) org = orgs[i]; }
    $("orgPick").value = id;
    writeState();
    render();
  }
  $("orgPick").addEventListener("change", function(){ selectOrg($("orgPick").value); });

  function showTab(t){
    tab = TABS.indexOf(t) > -1 ? t : "members";
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(x){
      x.setAttribute("aria-current", x.getAttribute("data-tab") === tab ? "true" : "false");
    });
    TABS.forEach(function(n){ $("tab-"+n).classList.toggle("hidden", n !== tab); });
    writeState();
  }

  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.addEventListener("click", function(){
      showTab(b.getAttribute("data-tab"));
      render();
    });
  });

  function render(){
    if(!org) return;
    if(tab === "members")   renderMembersTab();
    if(tab === "hospitals") renderHospitals();
    if(tab === "protocols") renderProtocols();
    if(tab === "tiles") renderTiles();
    if(tab === "equipment") renderEquipment();
    if(tab === "content") renderContent();
    if(tab === "media") renderMedia();
    if(tab === "settings")  renderSettings();
    if(tab === "features")  renderFeatures();
  }

  /* ================= MEMBERS =================
     One record per person. Everything about them is edited in one place:
     who they are, how to reach them, what they may do, the hats they wear,
     and their certifications. */

  var PEOPLE = [], BADGE_TYPES = [], CERT_TYPES = [];

  function personName(p){
    return ((p.first_name || "") + " " + (p.last_name || "")).trim() || "(no name)";
  }

  var MEMBER_SUB = "people";

  /* Members is now three views of the same people: the list, the
     certification dashboard across all of them, and the settings for what
     certifications this organization even tracks. */
  function renderMembersTab(){
    var el = $("tab-members");
    el.innerHTML = '<div class="card" style="padding:10px 14px"><div class="row">'
      + [["people","People"],["certs","Certification dashboard"],
         ["certtypes","What we track"]].map(function(t){
          return '<button class="btn js-msub'+(MEMBER_SUB===t[0]?" primary":"")+'" '
            + 'data-s="'+t[0]+'">'+esc(t[1])+'</button>';
        }).join("")
      + '</div></div><div id="member_body"></div>';

    Array.prototype.forEach.call(el.querySelectorAll(".js-msub"), function(b){
      b.addEventListener("click", function(){
        MEMBER_SUB = b.getAttribute("data-s"); renderMembersTab();
      });
    });

    if(MEMBER_SUB === "people")    renderMembers();
    if(MEMBER_SUB === "certs")     renderCerts();
    if(MEMBER_SUB === "certtypes") renderCertTypes();
  }

  function renderMembers(){
    var el = $("member_body");
    el.innerHTML = '<div class="card"><div class="empty">Loading\u2026</div></div>';

    Promise.all([
      db.from("people").select("*").eq("org_id", orgId).order("sort_order"),
      db.from("badge_types").select("name,color,sort_order")
        .eq("org_id", orgId).eq("is_active", true).order("sort_order"),
      db.from("memberships").select("user_id,status").eq("org_id", orgId)
    ]).then(function(r){
      if(r[0].error) throw r[0].error;
      PEOPLE = r[0].data || [];
      BADGE_TYPES = r[1].data || [];
      var signedIn = {};
      (r[2].data || []).forEach(function(m){ signedIn[m.user_id] = m.status; });

      var counts = { all: PEOPLE.length };
      PEOPLE.forEach(function(p){ counts[p.role] = (counts[p.role] || 0) + 1; });
      BADGE_TYPES.forEach(function(b){
        counts["badge:" + b.name] = PEOPLE.filter(function(p){
          return (p.badges || []).indexOf(b.name) > -1; }).length;
      });
      counts.nounit = PEOPLE.filter(function(p){ return !p.unit_number; }).length;

      function row(list){
        return list.map(function(f){
          var n = counts[f[0]] || 0;
          return '<button class="btn js-rfilter'+(ROSTER_FILTER===f[0]?" primary":"")+'" '
            + 'data-f="'+esc(f[0])+'"'+(n?"":" disabled")+'>'
            + esc(f[1]) + ' <span class="small">'+n+'</span></button>';
        }).join("");
      }

      var html = '<div class="card" style="padding:14px 16px">'
        + '<div class="row" style="margin-bottom:10px">'
        +   '<span class="small" style="min-width:60px">Can do</span>'
        +   row([["all","Everyone"],["admin","Administrators"],["dispatcher","Dispatchers"],
                 ["member","Responders"],["guest","Guests"],["nounit","No unit"]])
        + '</div>'
        + (BADGE_TYPES.length
            ? '<div class="row" style="margin-bottom:10px">'
              + '<span class="small" style="min-width:60px">Badge</span>'
              + row(BADGE_TYPES.map(function(b){ return ["badge:"+b.name, b.name]; }))
              + '</div>' : '')
        + '<div class="row">'
        +   '<span class="small" style="min-width:60px">Find</span>'
        +   '<input id="rsearch" placeholder="Name, unit, email or phone" '
        +   'value="'+esc(ROSTER_SEARCH)+'" style="flex:1;min-width:180px;padding:9px 11px;'
        +   'border-radius:9px;border:1px solid var(--line)">'
        +   '<button id="pp_new" class="btn primary">Add a person</button>'
        + '</div></div>';

      /* Reordering while a filter is on would renumber only what you can
         see and scramble the rest, so dragging waits until the list is whole. */
      var filtered = (ROSTER_FILTER !== "all") || !!ROSTER_SEARCH;

      var shown = PEOPLE.filter(function(p){
        if(ROSTER_FILTER === "nounit"){ if(p.unit_number) return false; }
        else if(ROSTER_FILTER !== "all"){
          if(ROSTER_FILTER.indexOf("badge:") === 0){
            if((p.badges||[]).indexOf(ROSTER_FILTER.slice(6)) < 0) return false;
          } else if(p.role !== ROSTER_FILTER) return false;
        }
        if(ROSTER_SEARCH){
          var hay = (personName(p) + " " + (p.unit_number||"") + " " + (p.email||"")
                     + " " + (p.phone||"")).toLowerCase();
          if(hay.indexOf(ROSTER_SEARCH.toLowerCase()) < 0) return false;
        }
        return true;
      });

      html += '<div class="card"><h2>People</h2>'
        + '<p class="hint">Showing '+shown.length+' of '+PEOPLE.length+'. '
        + 'Click anyone to open their record \u2014 details, what they may do, '
        + 'and their certifications, all in one place.</p>';

      if(!shown.length){
        html += '<div class="empty">'
          + (PEOPLE.length ? "Nobody matches that." : "Nobody added yet.") + '</div></div>';
      } else {
        html += '<div class="scroller tall"><table><thead><tr>'
          + '<th style="width:76px">Unit</th><th>Name</th><th>Contact</th>'
          + '<th style="width:110px">Can do</th><th>Badges</th>'
          + '<th style="width:96px">Duty</th><th style="width:88px">Signed in</th>'
          + '</tr></thead><tbody id="sortRows_people">';
        shown.forEach(function(p){
          html += '<tr class="js-person js-sortrow"'+(filtered?"":' draggable="true"')
            + ' data-id="'+p.id+'" style="cursor:pointer">'
            + '<td class="draghandle" title="Drag to move">\u2630</td>'
            + '<td><b>'+esc(p.unit_number || "\u2014")+'</b></td>'
            + '<td><b>'+esc(personName(p))+'</b>'
            +   (p.entry_type && p.entry_type !== "Responder"
                  ? '<div class="small">'+esc(p.entry_type)+'</div>' : '')
            + '</td>'
            + '<td class="small">'+esc(p.email || "")
            +   (p.phone ? '<br>'+esc(p.phone) : '')+'</td>'
            + '<td>'+esc({admin:"Administrator",dispatcher:"Dispatcher",
                          member:"Responder",guest:"Guest"}[p.role] || p.role)+'</td>'
            + '<td>'+ (p.badges||[]).map(function(b){
                  return '<span class="bchip on" style="cursor:default">'+esc(b)+'</span>';
                }).join(" ") + '</td>'
            + '<td class="small">'+esc(p.duty_status || "\u2014")+'</td>'
            + '<td>'+(p.user_id ? '<span class="pill active">yes</span>'
                                : '<span class="pill pending">not yet</span>')+'</td>'
            + '</tr>';
        });
        html += '</tbody></table></div></div>';
      }

      html += '<div class="card"><h2>Import a list of people</h2>'
        + '<p class="hint">Upload a spreadsheet. Recognised headings: First Name, Last Name, '
        + 'Unit, Email, Phone, Address, DOB, Level, Type, Admin, Dispatcher, Active, Status. '
        + 'Importing again updates people by unit number rather than duplicating them.</p>'
        + '<div class="f"><input id="mi_file" type="file" accept=".csv,.xlsx,.xls"></div>'
        + '<div id="mi_out"></div></div>';

      el.innerHTML = html;
      wireMemberImport();
      makeSortable("sortRows_people", "people", filtered
        ? "Clear the filter and the search to drag people into a new order." : null);
      Array.prototype.forEach.call(document.querySelectorAll(".js-rfilter"), function(b){
        b.addEventListener("click", function(){
          ROSTER_FILTER = b.getAttribute("data-f"); renderMembers();
        });
      });
      var rs = $("rsearch");
      if(rs) rs.addEventListener("input", function(){
        clearTimeout(window.__rst);
        window.__rst = setTimeout(function(){
          ROSTER_SEARCH = rs.value; renderMembers();
          var a = $("rsearch");
          if(a){ a.focus(); a.setSelectionRange(a.value.length, a.value.length); }
        }, 260);
      });
      var nb = $("pp_new");
      if(nb) nb.addEventListener("click", function(){ openPerson(null); });
    }).catch(function(e){
      el.innerHTML = '<div class="card"><div class="err">'
        + esc(e.message || "Could not load people") + '</div></div>';
    });
  }

  /* ---------- one person, everything about them ---------- */
  function openPerson(id){
    var p = null;
    for(var i=0;i<PEOPLE.length;i++){ if(PEOPLE[i].id === id) p = PEOPLE[i]; }
    var isNew = !p;
    if(isNew) p = { badges:[], role:"member", entry_type:"Responder", status:"active" };

    var scrim = document.createElement("div");
    scrim.className = "scrim"; scrim.id = "personScrim";
    scrim.innerHTML = '<div class="sheet wide">'
      + '<div class="row" style="justify-content:space-between;align-items:flex-start">'
      +   '<h2 style="margin:0">'+esc(isNew ? "New person" : personName(p))+'</h2>'
      +   '<button id="pp_close" class="btn">Close</button>'
      + '</div>'
      + '<div class="row" style="margin:12px 0 4px">'
      +   '<button class="btn primary js-ptab" data-t="details">Details</button>'
      +   (isNew ? '' : '<button class="btn js-ptab" data-t="certs">Certifications</button>')
      +   (isNew ? '' : '<button class="btn js-ptab" data-t="access">Access</button>')
      + '</div>'
      + '<div id="pp_body"></div>';
    document.body.appendChild(scrim);
    scrim.addEventListener("click", function(e){ if(e.target === scrim) scrim.remove(); });
    $("pp_close").addEventListener("click", function(){ scrim.remove(); });

    function tab(which){
      Array.prototype.forEach.call(scrim.querySelectorAll(".js-ptab"), function(b){
        b.classList.toggle("primary", b.getAttribute("data-t") === which);
      });
      if(which === "details") details();
      if(which === "certs")   certs();
      if(which === "access")  access();
    }
    Array.prototype.forEach.call(scrim.querySelectorAll(".js-ptab"), function(b){
      b.addEventListener("click", function(){ tab(b.getAttribute("data-t")); });
    });

    function details(){
      $("pp_body").innerHTML =
        '<div class="grid2">'
        + '<div class="f"><label>First name</label><input id="pf_first" value="'+esc(p.first_name||"")+'"></div>'
        + '<div class="f"><label>Last name</label><input id="pf_last" value="'+esc(p.last_name||"")+'"></div>'
        + '<div class="f"><label>Unit number</label><input id="pf_unit" value="'+esc(p.unit_number||"")+'"></div>'
        + '<div class="f"><label>Badge number</label><input id="pf_badge" value="'+esc(p.badge_number||"")+'"></div>'
        + '<div class="f"><label>Email <span class="small">how they sign in</span></label>'
        +   '<input id="pf_email" value="'+esc(p.email||"")+'"></div>'
        + '<div class="f"><label>Phone</label><input id="pf_phone" value="'+esc(p.phone||"")+'"></div>'
        + '<div class="f" style="grid-column:1/-1"><label>Address</label>'
        +   '<input id="pf_addr" value="'+esc(p.address||"")+'"></div>'
        + '<div class="f"><label>Date of birth</label>'
        +   '<input id="pf_dob" type="date" value="'+esc(p.date_of_birth||"")+'"></div>'
        + '<div class="f"><label>Level</label><input id="pf_level" value="'+esc(p.level||"")+'" placeholder="EMT / ALS"></div>'
        + '<div class="f"><label>Type</label><input id="pf_type" value="'+esc(p.entry_type||"")+'" placeholder="Responder / Doctor"></div>'
        + '<div class="f"><label>Duty</label><select id="pf_duty">'
        +   ["","Primary","Backup","Observer","Off"].map(function(x){
              return '<option value="'+esc(x)+'"'+((p.duty_status||"")===x?" selected":"")+'>'
                + (x||"\u2014")+'</option>'; }).join("")
        + '</select></div>'
        + '<div class="f"><label>Can do</label><select id="pf_role">'
        +   [["member","Responder"],["dispatcher","Dispatcher"],
             ["admin","Administrator"],["guest","Guest"]].map(function(x){
              return '<option value="'+x[0]+'"'+(p.role===x[0]?" selected":"")+'>'+x[1]+'</option>';
            }).join("")
        + '</select></div>'
        + '<div class="f"><label>Status</label><select id="pf_status">'
        +   ["active","suspended","removed"].map(function(x){
              return '<option value="'+x+'"'+(p.status===x?" selected":"")+'>'+x+'</option>';
            }).join("")
        + '</select></div>'
        + '</div>'
        + '<div class="f"><label>Badges</label><div class="badgepick" id="pf_badges">'
        +   BADGE_TYPES.map(function(b){
              var on = (p.badges||[]).indexOf(b.name) > -1;
              return '<button class="bchip js-pbadge'+(on?" on":"")+'" data-b="'+esc(b.name)+'">'
                + esc(b.name)+'</button>';
            }).join("")
        + '</div></div>'
        + '<div class="row" style="margin-top:14px">'
        +   '<button id="pf_save" class="btn primary">Save</button>'
        +   (isNew ? '' : '<button id="pf_del" class="btn danger">Delete this person</button>')
        + '</div>'
        + '<p class="hint" style="margin-top:10px">Members can change their own phone, address '
        + 'and date of birth from the app. Everything else on this page is yours alone.</p>';

      Array.prototype.forEach.call(scrim.querySelectorAll(".js-pbadge"), function(b){
        b.addEventListener("click", function(){ b.classList.toggle("on"); });
      });

      $("pf_save").addEventListener("click", function(){
        var badges = [];
        Array.prototype.forEach.call(scrim.querySelectorAll(".js-pbadge.on"), function(b){
          badges.push(b.getAttribute("data-b"));
        });
        var row = {
          org_id: orgId,
          first_name: $("pf_first").value.trim() || null,
          last_name:  $("pf_last").value.trim()  || null,
          unit_number:$("pf_unit").value.trim()  || null,
          badge_number:$("pf_badge").value.trim()|| null,
          email:      $("pf_email").value.trim().toLowerCase() || null,
          phone:      $("pf_phone").value.trim() || null,
          address:    $("pf_addr").value.trim()  || null,
          date_of_birth: $("pf_dob").value || null,
          level:      $("pf_level").value.trim() || null,
          entry_type: $("pf_type").value.trim()  || "Responder",
          duty_status:$("pf_duty").value || null,
          role:       $("pf_role").value,
          status:     $("pf_status").value,
          badges:     badges
        };
        var q = isNew ? db.from("people").insert(row)
                      : db.from("people").update(row).eq("id", p.id);
        q.then(function(r){
          if(r.error) return oops(r.error);
          scrim.remove(); toast("Saved"); renderMembers();
        }).catch(oops);
      });

      if($("pf_del")) $("pf_del").addEventListener("click", function(){
        if(!confirm("Delete " + personName(p) + " completely? Their certifications go too.")) return;
        db.from("people").delete().eq("id", p.id).then(function(r){
          if(r.error) return oops(r.error);
          scrim.remove(); toast("Deleted"); renderMembers();
        }).catch(oops);
      });
    }

    function certs(){
      $("pp_body").innerHTML = '<div class="empty">Loading\u2026</div>';
      Promise.all([
        db.from("certification_types")
          .select("id,name,is_required,warn_days_before,sort_order,tracking")
          .eq("org_id", orgId).eq("is_active", true).order("sort_order"),
        db.from("roster_certifications").select("*")
          .eq("org_id", orgId).eq("unit_number", p.unit_number || "~none~")
      ]).then(function(r){
        var types = r[0].data || [], have = {};
        (r[1].data || []).forEach(function(c){ have[c.cert_type_id] = c; });
        if(!p.unit_number){
          $("pp_body").innerHTML = '<div class="warn">This person has no unit number, and '
            + 'certifications are tracked by unit. Give them one on the Details tab first.</div>';
          return;
        }
        $("pp_body").innerHTML = '<div class="scroller tall"><table><thead><tr>'
          + '<th>Certification</th><th style="width:150px">Expires</th>'
          + '<th style="width:160px">Number</th><th style="width:110px">State</th>'
          + '</tr></thead><tbody>'
          + types.map(function(t){
              var h = have[t.id];
              var st = certState(h && h.expires_on, t.warn_days_before);
              return '<tr><td><b>'+esc(t.name)+'</b>'
                + (t.is_required ? '<span class="reqtag">REQUIRED</span>' : '') + '</td>'
                + '<td><input class="js-pcert" data-t="'+t.id+'" data-f="expires_on" '
                +   'type="date" value="'+esc(h && h.expires_on || "")+'"></td>'
                + '<td><input class="js-pcert" data-t="'+t.id+'" data-f="credential_number" '
                +   'value="'+esc(h && h.credential_number || "")+'"></td>'
                + '<td><span class="cellkey '+st.k+'">'
                +   (st.k === "missing" ? "nothing" : st.k) + '</span></td>'
                + '<td class="actions" style="white-space:nowrap">'
                +   (h && h.file_path
                        ? '<button class="btn js-pview" data-p="'+esc(h.file_path)+'" '
                          + 'style="padding:6px 10px;font-size:12.5px">View</button> '
                        : '')
                +   '<label class="btn" style="padding:6px 10px;font-size:12.5px;cursor:pointer">'
                +     (h && h.file_path ? "Replace" : "Attach")
                +     '<input type="file" class="js-pfile" data-t="'+t.id+'" '
                +     'accept="image/*,application/pdf" style="display:none"></label>'
                + '</td></tr>';
            }).join("")
          + '</tbody></table></div>'
          + '<div class="row" style="margin-top:14px">'
          +   '<button id="pp_export" class="btn primary">Download their whole file</button>'
          +   '<span class="small">Everything on this page plus every document, as one zip</span>'
          + '</div>'
          + '<div id="pp_expout" class="mono" style="margin-top:8px"></div>'
          + '<p class="hint" style="margin-top:12px">Changes save when you click out of a box.</p>';

        $("pp_export").addEventListener("click", function(){
          exportPerson(p, types, have);
        });

        Array.prototype.forEach.call(scrim.querySelectorAll(".js-pdone"), function(cb){
          cb.addEventListener("change", function(){
            db.from("roster_certifications").upsert({
              org_id: orgId, unit_number: p.unit_number,
              cert_type_id: cb.getAttribute("data-t"),
              completed: cb.checked,
              completed_on: cb.checked ? new Date().toISOString().slice(0,10) : null
            }, { onConflict:"org_id,unit_number,cert_type_id" })
             .then(function(r){ if(r.error) oops(r.error); else toast("Saved"); });
          });
        });

        Array.prototype.forEach.call(scrim.querySelectorAll(".js-pview"), function(b){
          b.addEventListener("click", function(){
            db.storage.from("member-docs").createSignedUrl(b.getAttribute("data-p"), 300)
              .then(function(r){
                if(r.error || !r.data) return oops(r.error || new Error("Could not open it."));
                window.open(r.data.signedUrl, "_blank", "noopener");
              }).catch(oops);
          });
        });

        /* Not everyone will send their own document in. An administrator
           needs to be able to put one on file for them. */
        Array.prototype.forEach.call(scrim.querySelectorAll(".js-pfile"), function(inp){
          inp.addEventListener("change", function(e){
            var f = e.target.files && e.target.files[0];
            if(!f) return;
            if(f.size > 10 * 1024 * 1024){ toast("That file is larger than 10 MB."); return; }
            if(!p.user_id && !p.unit_number){ toast("Give this person a unit first."); return; }
            var who = p.user_id || ("unit-" + String(p.unit_number).toLowerCase());
            var clean = f.name.toLowerCase().replace(/[^a-z0-9._-]+/g, "-");
            var path = orgId + "/certs/" + who + "/" + Date.now().toString(36) + "-" + clean;

  /* ---------- importing a roster ---------- */
  function wireMemberImport(){
    var f = $("mi_file");
    if(!f) return;
    f.addEventListener("change", function(e){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var out = $("mi_out");
      out.innerHTML = '<div class="empty">Reading\u2026</div>';
      var fr = new FileReader();
      fr.onload = function(ev){
        try{
          var wb = XLSX.read(ev.target.result, { type:"array" });
          var grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],
                       { header:1, blankrows:false, defval:"" });
          var head = grid[0].map(function(h){ return String(h||"").trim().toLowerCase(); });
          function col(){
            for(var i=0;i<arguments.length;i++){
              var k = head.indexOf(arguments[i]);
              if(k > -1) return k;
            }
            return -1;
          }
          var cF = col("first name","first"), cL = col("last name","last"),
              cU = col("unit","unit #"), cA = col("admin"),
              cD = col("dispatcher"), cAc = col("active"), cS = col("status"),
              cE = col("email","email address","e-mail");
          if(cU < 0){ throw new Error("No column named Unit was found."); }

          var yes = function(v){
            return ["x","yes","true","1"].indexOf(String(v||"").trim().toLowerCase()) > -1;
          };
          var rows = [];
          grid.slice(1).forEach(function(r){
            var unit = String(r[cU]||"").trim();
            if(!unit) return;
            var nm = ((cF>-1?String(r[cF]||"").trim():"") + " " +
                      (cL>-1?String(r[cL]||"").trim():"")).trim();
            rows.push({
              unit_number: unit,
              display_name: nm || null,
              email: (cE>-1 ? String(r[cE]||"").trim().toLowerCase() : "") || null,
              role: (cA>-1 && yes(r[cA])) ? "admin" : "member",
              is_dispatcher: cD>-1 ? yes(r[cD]) : false,
              status: (cAc<0 || yes(r[cAc])) ? "active" : "suspended",
              duty_status: cS>-1 ? (String(r[cS]||"").trim() || null) : null
            });
          });
          if(!rows.length) throw new Error("No rows with a unit number.");

          var admins = rows.filter(function(x){ return x.role === "admin"; }).length;
          var disps  = rows.filter(function(x){ return x.is_dispatcher; }).length;
          out.innerHTML = '<div class="warn"><b>'+rows.length+' people.</b><br>'
            + admins+' administrators, '+disps+' dispatchers.</div>'
            + '<div class="scroller tall"><table><thead><tr><th>Unit</th><th>Name</th><th>Role</th>'
            + '<th>Dispatcher</th><th>Duty</th></tr></thead><tbody>'
            + rows.slice(0,6).map(function(x){
                return '<tr><td>'+esc(x.unit_number)+'</td><td>'+esc(x.display_name||"\u2014")
                  + '</td><td>'+x.role+'</td><td>'+(x.is_dispatcher?"yes":"\u2014")
                  + '</td><td>'+esc(x.duty_status||"\u2014")+'</td></tr>'; }).join("")
            + '</tbody></table></div>'
            + (rows.length>6 ? '<p class="hint">First 6 of '+rows.length+'.</p>' : '')
            + '<button id="mi_go" class="btn primary" style="margin-top:12px">'
            + 'Import '+rows.length+' people</button>';
          MEMBER_ROWS = rows;
        }catch(err){
          out.innerHTML = '<div class="err">'+esc(err.message||"Could not read that file.")+'</div>';
        }
      };
      fr.readAsArrayBuffer(file);
    });
  }

     A protocol book is useless as a flat run of pages. Members look things

     it does not, the admin pastes the book's own contents page here. */

  var TOC_SET = null;

  function openToc(setId, setName){
    TOC_SET = setId;
    db.from("protocol_toc").select("name,volume,page_number,page_label,sort_order")
      .eq("set_id", setId).order("sort_order")
      .then(function(r){

          + 'page number at the end:</p>'
          + '<pre class="mono" style="background:#F4F6FA;padding:11px;border-radius:9px;'
          +   'white-space:pre-wrap;margin:0 0 13px">Cardiac\n'
          +   '6.03  Chest Pain    47\n'
          +   '6.04  Cardiac Arrest    52\n'
          +   'Respiratory\n'

          + '<div class="f"><textarea id="toc_data" rows="10" placeholder="Paste the contents here">'
          + esc(existing.map(function(e){
              return (e.volume ? "" : "") + e.name + "\t" + e.page_number;
            }).join("\n"))
          + '</textarea></div>'
          + '<div class="row"><button id="toc_check" class="btn primary">Check it</button>'
          +   '<button id="toc_save" class="btn ok hidden">Save contents</button>'
          +   '<button id="toc_back" class="btn">Back</button></div>'
          + '<div id="toc_out" style="margin-top:13px">'
          +   (existing.length ? '<div class="warn">'+existing.length
                + ' entries saved at the moment.</div>' : '')
          + '</div></div>';
      }).catch(oops);
  }

  function parseToc(text){
    var lines = text.replace(/\r/g,"").split("\n");
    var out = [], volume = null, order = 0, bad = 0;

    lines.forEach(function(raw){
      var line = raw.trim();
      if(!line) return;

      // a page number at the end of the line, possibly after dot leaders
      var m = line.match(/^(.*?)[\s.\u2026\t]+(\d{1,4})$/);
      if(!m){
        // no page number: this is a section heading
        if(line.length <= 60){ volume = line; }
        else { bad++; }
        return;
      }
      var name = m[1].replace(/[.\u2026\s]+$/,"").trim();
      var page = parseInt(m[2], 10);
      if(!name || !page){ bad++; return; }
      order++;
      out.push({ org_id:orgId, set_id:TOC_SET, name:name, volume:volume,
                 page_number:page, sort_order:order });
    });
    return { rows:out, bad:bad };
  }

  function checkToc(){
    var r = parseToc($("toc_data").value);
    var out = $("toc_out");
    if(!r.rows.length){
      out.innerHTML = '<div class="err">No entries found. Each line needs a page number at the end.</div>';
      $("toc_save").classList.add("hidden");
      return;
    }
    var vols = {};
    r.rows.forEach(function(x){ if(x.volume) vols[x.volume] = 1; });
    var maxPage = r.rows.reduce(function(a,b){ return Math.max(a, b.page_number); }, 0);

    out.innerHTML = '<div class="warn"><b>'+r.rows.length+' entries.</b>'
      + (Object.keys(vols).length ? '<br>Headings: '+esc(Object.keys(vols).join(", ")) : '')
      + '<br>Highest page referred to: '+maxPage
      + (r.bad ? '<br>'+r.bad+' lines could not be read and will be left out.' : '')
      + '</div>'
      + '<div class="scroller tall"><table><thead><tr><th>Heading</th><th>Entry</th><th>Page</th>'
      + '</tr></thead><tbody>'
      + r.rows.slice(0,8).map(function(x){
          return '<tr><td class="small">'+esc(x.volume||"\u2014")+'</td>'
            + '<td>'+esc(x.name)+'</td><td>'+x.page_number+'</td></tr>';
        }).join("")
      + '</tbody></table></div>'
      + (r.rows.length > 8 ? '<p class="hint">First 8 of '+r.rows.length+'.</p>' : '');
    $("toc_save").classList.remove("hidden");
  }

  function saveToc(){
    var r = parseToc($("toc_data").value);
    if(!r.rows.length) return;
    var b = $("toc_save"); b.disabled = true; b.textContent = "Saving\u2026";
    db.from("protocol_toc").delete().eq("set_id", TOC_SET).then(function(d){

    });
  }

  var OUR_FIELDS = [
    { key:"name",       label:"Hospital name", required:true,
      aliases:["hospital name","name","hospital","facility","facility name"] },
    { key:"phone_call", label:"Phone number",
      aliases:["phone (call)","phone call","phone","main phone","telephone","tel","contact"] },
    { key:"phone_red",  label:"Red phone",
      aliases:["red phone","redphone","red","direct line","er phone"] },
    { key:"address",    label:"Address",
      aliases:["address (navigate)","address","street address","location","street"] },
    { key:"door_code",  label:"Door code",
      aliases:["door code","doorcode","door","entry code","keypad","access code"] },
    { key:"lat",        label:"Latitude (ambulance bay)",  aliases:["latitude","lat"] },
    { key:"lng",        label:"Longitude (ambulance bay)", aliases:["longitude","lng","long","lon"] }
  ];
  var SKIP_HEADERS = ["code","specialties (summary)","specialties","summary","notes"];
  var IMP = null;

  function norm(h){ return String(h||"").trim().toLowerCase(); }

  function autoMap(headers, rows){
    return headers.map(function(h, i){
      var n = norm(h);
      if(!n) return "ignore";
      if(n === "hide") return "hide";
      if(SKIP_HEADERS.indexOf(n) > -1) return "ignore";
      for(var f=0; f<OUR_FIELDS.length; f++){
        if(OUR_FIELDS[f].aliases.indexOf(n) > -1) return OUR_FIELDS[f].key;
      }
      var ticks = 0, filled = 0;
      for(var r=0; r<rows.length; r++){
        var v = String(rows[r][i] == null ? "" : rows[r][i]).trim().toUpperCase();
        if(!v) continue;
        filled++;
        if(v === "X" || v === "YES" || v === "TRUE" || v === "1") ticks++;
      }
      if(filled && ticks === filled) return "specialty";
      return "ignore";
    });
  }

  function downloadTemplate(){
    var headers = ["Hospital Name","Phone (Call)","Red Phone","Address","Door Code",
                   "Latitude","Longitude","Trauma","Stroke","Cardiac","Paediatric"];
    var examples = [
      ["Example General Hospital","713-555-1000","713-555-1911",
       "100 Main Street, Yourtown","4412#","29.709600","-95.397100","X","X","X",""],
      ["Example Children's Hospital","713-555-2000","",
       "200 Second Street, Yourtown","","","","","","","X"]
    ];
    var csv = [headers].concat(examples).map(function(r){
      return r.map(function(c){
        return /[",\n]/.test(c) ? '"'+String(c).replace(/"/g,'""')+'"' : c;
      }).join(",");
    }).join("\r\n");
    var blob = new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "hospital-list-template.csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast("Template downloaded");

  function readFile(file){
    $("imp_out").innerHTML = '<div class="card"><div class="empty">Reading '+esc(file.name)+'\u2026</div></div>';
    var fr = new FileReader();
    fr.onerror = function(){
      $("imp_out").innerHTML = '<div class="err">Could not read that file.</div>';
    };
    fr.onload = function(e){
      try{
        var wb = XLSX.read(e.target.result, { type:"array" });
        var grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],
                     { header:1, blankrows:false, defval:"" });
        if(!grid.length) throw new Error("That file looks empty.");
        var headers = grid[0].map(function(h){ return String(h == null ? "" : h).trim(); });
        var rows = grid.slice(1).filter(function(r){
          return r.some(function(c){ return String(c == null ? "" : c).trim() !== ""; });
        });
        if(!rows.length) throw new Error("That file has headings but no rows.");
        IMP = { headers:headers, rows:rows, mapping:autoMap(headers, rows) };
        renderMapping();
      }catch(err){
        $("imp_out").innerHTML = '<div class="err">'+esc(err.message||"Could not understand that file.")
          + ' Try saving it as .csv and uploading again.</div>';
      }
    };
    fr.readAsArrayBuffer(file);
  }

            + '<option value="specialty"'+(sel==="specialty"?" selected":"")+'>A specialty (X = has it)</option>'

    };
    var hasName = IMP.mapping.indexOf("name") > -1;
    var used = {};
    IMP.mapping.forEach(function(m){ if(m !== "ignore" && m !== "specialty") used[m] = (used[m]||0)+1; });
    var dupes = Object.keys(used).filter(function(k){ return used[k] > 1; });

      + '<p class="hint">We have guessed what each column means. Change anything wrong.</p>';

        + '</div><span class="arrow">\u2192</span>'

    });

      + '<button id="imp_preview" class="btn primary"'+((!hasName||dupes.length)?" disabled":"")+'>Preview import</button>'
      + '<button id="imp_cancel" class="btn">Start over</button></div></div>';

  function buildRows(){
    var map = {}, specCols = [], hideCol = -1;
    IMP.mapping.forEach(function(m, i){
      if(m === "ignore") return;
      if(m === "specialty"){ specCols.push({ i:i, label:IMP.headers[i] }); return; }
      if(m === "hide"){ hideCol = i; return; }
      map[m] = i;
    });
    var out = [], skipped = 0;
    IMP.rows.forEach(function(cells, n){
      var cell = function(i){
        return i === undefined ? "" : String(cells[i] == null ? "" : cells[i]).trim();
      };
      if(hideCol > -1 && cell(hideCol).toUpperCase() === "X"){ skipped++; return; }
      var name = cell(map.name);
      if(!name){ skipped++; return; }
      var specs = [];
      specCols.forEach(function(sc){
        var v = cell(sc.i).toUpperCase();
        if(v === "X" || v === "YES" || v === "TRUE" || v === "1") specs.push(sc.label);
      });
      var lat = parseFloat(cell(map.lat)), lng = parseFloat(cell(map.lng));
      out.push({ org_id: orgId, name: name,
        phone_call: cell(map.phone_call) || null,
        phone_red:  cell(map.phone_red)  || null,
        address:    cell(map.address)    || null,
        door_code:  cell(map.door_code)  || null,
        lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng,
        specialties: specs, sort_order: (n + 1) * 10 });
    });
    return { rows:out, skipped:skipped, specCols:specCols.map(function(c){ return c.label; }) };
  }

  function processPdf(file, name, version){
    var go = $("pr_go");
    go.disabled = true;
    $("pr_progress").classList.remove("hidden");
    setProgress(0, 1, "Opening the PDF\u2026");

    var setId = null, pdf = null, total = 0;
    var reader = new FileReader();
    reader.onerror = function(){ stop("Could not read that file."); };
    reader.onload = function(e){
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      pdfjsLib.getDocument({ data:new Uint8Array(e.target.result) }).promise
        .then(function(doc){
          pdf = doc; total = doc.numPages;
          setProgress(0, total, "Found " + total + " pages. Creating the book\u2026");
          return db.from("protocol_sets").insert({
            org_id: orgId, name: name, version: version,
            page_count: total, is_published: false
          }).select().single();
        })
        .then(function(r){
          if(r.error) throw r.error;
          setId = r.data.id;
          return runPages();
        })
        .then(function(){
          setProgress(total, total, "Done. " + total + " pages ready.");
          go.disabled = false;
          toast("Uploaded " + name);
          renderProtocols();
        })
        .catch(function(err){ stop(err && err.message ? err.message : "Something went wrong."); });
    };
    reader.readAsArrayBuffer(file);

    function stop(msg){
      go.disabled = false;
      $("pr_err").innerHTML = '<div class="err" style="margin-top:12px">'+esc(msg)+'</div>';
      setProgress(0, 1, "Stopped.");
    }

    function runPages(){
      var n = 0;
      function next(){
        n++;
        if(n > total) return Promise.resolve();
        setProgress(n-1, total, "Page " + n + " of " + total + "\u2026");
        return onePage(n).then(next);
      }
      return next();
    }

    function onePage(n){
      return pdf.getPage(n).then(function(page){
        var vp1 = page.getViewport({ scale:1 });
        var vp = page.getViewport({ scale: PDF_SCALE_WIDTH / vp1.width });
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
        var ctx = canvas.getContext("2d");
        return page.render({ canvasContext:ctx, viewport:vp }).promise
          .then(function(){ return page.getTextContent(); })
          .then(function(tc){
            var text = tc.items.map(function(i){ return i.str; }).join(" ")
                         .replace(/\s+/g," ").trim();
            return new Promise(function(resolve, reject){
              canvas.toBlob(function(blob){
                if(!blob) return reject(new Error("Could not turn page " + n + " into an image."));
                var path = orgId + "/protocols/" + setId + "/p"
                         + String(n).padStart(4,"0") + ".jpg";
                db.storage.from("org-branding").upload(path, blob, {
                  contentType:"image/jpeg", upsert:true
                }).then(function(up){
                  if(up.error) return reject(new Error("Upload blocked on page " + n + ": " + up.error.message));
                  return db.from("protocol_pages").insert({
                    org_id: orgId, set_id: setId, page_number: n,
                    image_path: path, body_text: text
                  });
                }).then(function(ins){
                  if(ins && ins.error) return reject(ins.error);
                  canvas.width = canvas.height = 0;
                  resolve();
                }).catch(reject);
              }, "image/jpeg", PDF_QUALITY);
            });
          });
      });
    }
  }


  /* Dragging a row changes the order it will be saved in. Nobody should
     have to type numbers to say what comes first.

     One rule: dragging is switched off while a filter or a search is on,
     because reordering three visible rows out of forty would quietly
     scramble the rest. */
  function makeSortable(bodyId, table, disabledReason){
    var body = $(bodyId);
    if(!body) return;

    var rows = body.querySelectorAll(".js-sortrow");
    if(disabledReason){
      Array.prototype.forEach.call(rows, function(tr){
        tr.removeAttribute("draggable");
        var h = tr.querySelector(".draghandle");
        if(h){ h.textContent = "\u00B7"; h.title = disabledReason; h.style.cursor = "default"; }
      });
      return;
    }

    var dragging = null;

    Array.prototype.forEach.call(rows, function(tr){
      tr.addEventListener("dragstart", function(e){
        dragging = tr; tr.classList.add("dragging");
        try{
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", "");
        }catch(x){}
      });
      tr.addEventListener("dragend", function(){
        tr.classList.remove("dragging");
        Array.prototype.forEach.call(body.querySelectorAll(".js-sortrow"), function(r){
          r.classList.remove("dragover");
        });
        dragging = null;
        restack();
      });
      tr.addEventListener("dragover", function(e){
        e.preventDefault();
        if(!dragging || dragging === tr) return;
        tr.classList.add("dragover");
        var box = tr.getBoundingClientRect();
        var after = (e.clientY - box.top) > box.height / 2;
        body.insertBefore(dragging, after ? tr.nextSibling : tr);
      });
      tr.addEventListener("dragleave", function(){ tr.classList.remove("dragover"); });
    });

    function restack(){
      Array.prototype.forEach.call(body.querySelectorAll(".js-sortrow"), function(tr, i){
        markEdit(table, tr.getAttribute("data-id"), "sort_order", (i + 1) * 10);
      });
    }
  }

    var buckets = [["org-branding", folders], ["org-media", ["protocols","docs"]],
                   ["member-docs", []]];
    var total = 0, rows = [];

    function walk(bucket, prefix){
      return db.storage.from(bucket).list(orgId + (prefix ? "/" + prefix : ""),
        { limit: 1000 }).then(function(r){
          var files = (r.data || []).filter(function(f){ return f.name; });
          var bytes = files.reduce(function(a, f){
            return a + ((f.metadata && f.metadata.size) || 0);
          }, 0);
          if(files.length){
            total += bytes;
            rows.push({ what: prefix || bucket, files: files.length, bytes: bytes });
          }
        }).catch(function(){});
    }

    var jobs = [];
    buckets.forEach(function(b){
      if(!b[1].length) jobs.push(walk(b[0], ""));
      else b[1].forEach(function(p){ jobs.push(walk(b[0], p)); });
    });

    Promise.all(jobs).then(function(){
      var mb = total / 1048576;
      var pct = Math.min(100, Math.round(mb / FREE_LIMIT_MB * 100));
      box.innerHTML =
        '<p class="hint">This organization is using <b>' + mb.toFixed(1) + ' MB</b> of the '
        + FREE_LIMIT_MB + ' MB included on the free plan.</p>'
        + '<div class="bar-outer"><div class="bar-inner" style="width:' + pct + '%;'
        +   (pct > 85 ? 'background:#B3121B' : '') + '"></div></div>'
        + '<p class="mono">' + pct + '% used</p>'
        + (rows.length
            ? '<div class="scroller tall"><table><thead><tr><th>What</th><th>Files</th>'
              + '<th>Size</th></tr></thead><tbody>'
              + rows.sort(function(a,b){ return b.bytes - a.bytes; }).map(function(x){
                  return '<tr><td>' + esc(x.what) + '</td><td>' + x.files + '</td>'
                    + '<td>' + (x.bytes/1048576).toFixed(1) + ' MB</td></tr>';
                }).join("")
              + '</tbody></table></div>'
            : '<p class="hint">Nothing stored yet.</p>')
        + '<p class="hint">Page images from a protocol book are usually the largest thing here. '
        + 'Deleting a book you no longer publish frees that space.</p>';
    });
  }

  function wireMedia(){
    var kind = $("md_kind"), files = $("md_files");
    if(!kind) return;
    kind.addEventListener("change", function(){
      for(var i=0;i<MEDIA_KINDS.length;i++){
        if(MEDIA_KINDS[i].key === kind.value) $("md_hint").textContent = MEDIA_KINDS[i].hint;
      }
      listMedia();
    });
    files.addEventListener("change", function(e){
      MEDIA_QUEUE = Array.prototype.slice.call(e.target.files || []);
      var go = $("md_go");
      if(!MEDIA_QUEUE.length){ go.classList.add("hidden"); return; }
      var mb = MEDIA_QUEUE.reduce(function(a,f){ return a + f.size; }, 0) / 1048576;
      $("md_out").innerHTML = '<div class="warn">'+MEDIA_QUEUE.length+' files, '
        + mb.toFixed(1) + ' MB in total.</div>';
      go.classList.remove("hidden");
      go.textContent = "Upload " + MEDIA_QUEUE.length + " images";
    });
  }

  function mediaPath(kind, name){
    return orgId + "/" + kind + "/" + String(name).toLowerCase().replace(/[^a-z0-9._-]+/g, "-");
  }
  function publicUrl(path){
    var r = db.storage.from("org-branding").getPublicUrl(path);
    return (r && r.data && r.data.publicUrl) || "";
  }

  function uploadMedia(){
    if(!MEDIA_QUEUE || !MEDIA_QUEUE.length) return;
    var kind = $("md_kind").value;
    var go = $("md_go"); go.disabled = true;
    $("md_progress").classList.remove("hidden");
    var done = 0, failed = [], total = MEDIA_QUEUE.length;

    function step(i){
      if(i >= total){
        go.disabled = false;
        $("md_status").textContent = failed.length
          ? (done + " uploaded, " + failed.length + " failed") : (done + " uploaded");
        $("md_out").innerHTML = failed.length
          ? '<div class="err">These did not upload:<br>' + failed.map(esc).join("<br>") + '</div>'
          : '<div class="warn">All ' + done + ' uploaded.</div>';
        MEDIA_QUEUE = null;
        $("md_files").value = "";
        if(kind === "apartments") linkApartments();
        else if(kind === "tile-icons") linkTileIcons();
        listMedia();
        return;
      }
      var f = MEDIA_QUEUE[i];
      $("md_bar").style.width = Math.round(i/total*100) + "%";
      $("md_status").textContent = (i+1) + " of " + total + " \u00B7 " + f.name;
      db.storage.from("org-branding")
        .upload(mediaPath(kind, f.name), f, { upsert:true, contentType:f.type || "image/jpeg" })
        .then(function(r){
          if(r.error) failed.push(f.name + " (" + r.error.message + ")"); else done++;
          step(i+1);
        })
        .catch(function(){ failed.push(f.name); step(i+1); });
    }
    step(0);
  }

  function linkApartments(){
    db.storage.from("org-branding").list(orgId + "/apartments", { limit: 500 })
      .then(function(r){
        var files = (r.data || []).filter(function(f){ return f.name; });
        if(!files.length) return;
        return db.from("complexes").select("id,name,map_path").eq("org_id", orgId)
          .then(function(ex){
            var have = {};
            (ex.data || []).forEach(function(c){
              have[String(c.map_path||"").split("/").pop()] = c;
            });
            var add = [];
            files.forEach(function(f){
              if(have[f.name]) return;
              var stem = f.name.replace(/\.[a-z0-9]+$/i, "");
              add.push({ org_id: orgId,
                name: stem.replace(/[-_]+/g," ").replace(/\b\w/g, function(c){ return c.toUpperCase(); }),
                map_path: publicUrl(orgId + "/apartments/" + f.name),
                is_active: true, sort_order: 500 });
            });
            if(!add.length) return;
            return db.from("complexes").insert(add).then(function(){
              toast("Created " + add.length + " apartment complexes");
            });
          });
      }).catch(function(){});
  }

  function linkTileIcons(){
    db.storage.from("org-branding").list(orgId + "/tile-icons", { limit: 200 })
      .then(function(r){
        var files = (r.data || []).filter(function(f){ return f.name; });
        if(!files.length) return;
        return db.from("tiles").select("id,label,image_path").eq("org_id", orgId)
          .then(function(t){
            var jobs = [];
            (t.data || []).forEach(function(tile){
              var want = String(tile.image_path || "").split("/").pop().toLowerCase()
                           .replace(/[^a-z0-9._-]+/g, "-");
              if(!want) return;
              for(var i=0;i<files.length;i++){
                if(files[i].name.toLowerCase() === want){
                  jobs.push(db.from("tiles")
                    .update({ image_path: publicUrl(orgId + "/tile-icons/" + files[i].name) })
                    .eq("id", tile.id));
                  break;
                }
              }
            });
            if(jobs.length) return Promise.all(jobs).then(function(){
              toast("Linked " + jobs.length + " tile icons");
            });
          });
      }).catch(function(){});
